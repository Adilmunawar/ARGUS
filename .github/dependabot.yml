version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    groups:
      actions:
        patterns:
          - "*"

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
      semver-major-days: 14
    groups:
      console-prototype-tests:
        patterns:
          - "*"

  - package-ecosystem: npm
    directory: /platform/console/server
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
      semver-major-days: 14
    groups:
      aws-sdk:
        patterns:
          - "@aws-sdk/*"
      server:
        patterns:
          - "*"
        exclude-patterns:
          - "@aws-sdk/*"

  - package-ecosystem: docker
    directory: /platform/console/server
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
