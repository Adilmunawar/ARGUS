groups:
  - name: mills
    rules:
      - alert: MillsHigh5xx
        expr: sum(rate(yarp_requests_total{app="mills",code=~"5.."}[5m])) / sum(rate(yarp_requests_total{app="mills"}[5m])) > 0.01
        for: 5m
        labels: { severity: page, app: mills }
      - alert: MillsSlowP95
        expr: histogram_quantile(0.95, sum(rate(http_server_request_duration_seconds_bucket{app="mills"}[5m])) by (le)) > 1
        for: 10m
        labels: { severity: page, app: mills }
      - alert: MillsPrecomputeOverrun
        expr: time() - argus_functions_last_success_timestamp{function="mills-precompute"} > 5400
        labels: { severity: page, app: mills }
      - alert: UmairDbBackupStale
        expr: time() - argus_sql_last_log_backup_timestamp{database="umairv3_db"} > 1800
        labels: { severity: page, app: mills }
