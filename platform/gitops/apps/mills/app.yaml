apiVersion: argus/v1
kind: ServiceFabricApp
metadata:
  name: mills
  owner: zayan
  repo: Zarz001/Mills-Restructured-by-Zayan
  tier: 1
spec:
  package:
    bucket: argus-artifacts
    key: mills/{{ version }}.sfpkg
    signature: authenticode
  identity: gmsa-mills$
  services:
    - name: MillsGateway
      type: GuestExecutable
      exe: MillsDashboard.Gateway.exe
      instances: 2
      endpoints: [{ name: http, port: 5140 }]
      env:
        ASPNETCORE_URLS: http://0.0.0.0:5140
        ReverseProxy__Clusters__api__Destinations__api__Address: http://localhost:5141/
        ReverseProxy__Clusters__web__Destinations__web__Address: http://localhost:3100/
    - name: MillsApi
      type: GuestExecutable
      exe: MillsDashboard.Api.exe
      instances: 3
      endpoints: [{ name: http, port: 5141 }]
      env:
        ASPNETCORE_URLS: http://0.0.0.0:5141
        ConnectionStrings__Default: "Server=sql-01.argus.local,1433;Database=umairv3_db;Integrated Security=true;Encrypt=True;TrustServerCertificate=False;MultipleActiveResultSets=False;Min Pool Size=5;Packet Size=32767;Connect Timeout=30;Application Name=MillsDashboardApi;"
        ConnectionStrings__Finance: "Server=sql-01.argus.local,1433;Database=FarmerFacilitatorDb;Integrated Security=true;Encrypt=True;TrustServerCertificate=False;"
        Jwt__SigningKey: "{{ openbao:kv/mills/jwt-signing-key#value }}"
        LegacyJwt__SigningKey: "{{ openbao:kv/mills/legacy-jwt#value }}"
        Ai__ApiKey: "{{ openbao:kv/mills/anthropic#value }}"
        OpenRouteService__BaseUrl: http://ors.argus.local:8082/ors
        Cache__Redis: garnet.argus.local:6379,ssl=true
        Nats__Url: nats://nats.argus.local:4222
        SurveyImages__S3Bucket: argus-survey-pictures
        OTEL_EXPORTER_OTLP_ENDPOINT: http://otel.argus.local:4318
      resources: { cpuCores: 2, memoryMiB: 4096 }
    - name: MillsWeb
      type: GuestExecutable
      exe: node.exe
      args: server.js
      instances: 2
      endpoints: [{ name: http, port: 3100 }]
      env:
        PORT: "3100"
        HOSTNAME: 0.0.0.0
        MILLS_API_BASE: http://localhost:5141/api/v1
        EE_BASE64_KEY: "{{ openbao:kv/mills/ee-service-key#value }}"
        HTTPS_PROXY: http://egress.argus.local:3128
  ingress:
    host: mills.zaraatdost.pk
    upstream: MillsGateway
    waf: owasp-crs
    rateLimit: { perIpPerMinute: 600 }
  health:
    probe: { path: /api/v1/health, upstream: MillsApi, intervalSeconds: 10 }
    upgradePolicy:
      failureAction: Rollback
      healthCheckStableDurationSeconds: 120
      upgradeDomainTimeoutSeconds: 900
  egress:
    allow: [api.anthropic.com, earthengine.googleapis.com]
  alerts: alerts.yaml
