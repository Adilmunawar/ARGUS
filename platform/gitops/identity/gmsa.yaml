apiVersion: argus/v1
kind: ServiceAccounts
# Every service identity. Passwords are managed by AD (30-day rotation); no human knows them.
accounts:
  - { name: gmsa-sf$,          hosts: [sf-01, sf-02, sf-03, sf-04, sf-05], tier: 1 }
  - { name: gmsa-mills$,       hosts: [sf-*],  tier: 1, sql: [umairv3_db, FarmerFacilitatorDb], s3: [argus-survey-pictures:r] }
  - { name: gmsa-mills-jobs$,  hosts: [sf-*],  tier: 1, sql: [umairv3_db], s3: [argus-survey-pictures:rw] }
  - { name: gmsa-loan$,        hosts: [sf-*],  tier: 1, sql: [FarmerFacilitatorDb] }
  - { name: gmsa-console$,     hosts: [sf-*],  tier: 1, sql: [ArgusConsole] }
  - { name: gmsa-reconciler$,  hosts: [sf-*],  tier: 0, notes: "SF cluster admin; JEA to hv-*; SeaweedFS admin; OpenBao policy-admin" }
  - { name: gmsa-sql$,         hosts: [sql-01, sql-02], tier: 1 }
  - { name: gmsa-backup$,      hosts: [sql-01, sql-02, pg-01, wef-01, forgejo-01], tier: 1, s3: [argus-backups:put-only] }
  - { name: gmsa-restore$,     hosts: [sql-drill-01, sql-02], tier: 1, s3: [argus-backups:r] }
  - { name: gmsa-seaweed$,     hosts: [sw-master-01, sw-master-02, sw-master-03, sw-b01], tier: 1 }
  - { name: gmsa-caddy$,       hosts: [sf-*], tier: 1 }
  - { name: gmsa-ci$,          hosts: [runner-01, runner-02], tier: 1, s3: [argus-artifacts:put-only], codesign: true }
  - { name: gmsa-guacamole$,   hosts: [guac-01], tier: 1, kind: linux-sssd, s3: [argus-sessions:put-only], notes: "receives one-time VM credentials from OpenBao; never stores them" }
  - { name: svc-ml,            hosts: [gpu-01], tier: 1, kind: linux-sssd, s3: [argus-sentinel:rw, argus-ml:rw, argus-rasters:rw] }
  - { name: gmsa-loki$,        hosts: [sf-*], tier: 1, s3: [argus-logs:rw] }
  - { name: gmsa-geo$,         hosts: [sf-*], tier: 1, sql: [argus_geo, pgstac], s3: [argus-rasters:r, argus-sentinel:r] }
  - { name: gmsa-agis$,        hosts: [sf-*], tier: 1, sql: [argus_geo], s3: [argus-rasters:r] }
