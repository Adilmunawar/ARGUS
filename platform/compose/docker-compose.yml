name: argus

x-logging: &logging
  driver: json-file
  options: { max-size: "10m", max-file: "3" }

x-hardening: &hardening
  restart: unless-stopped
  logging: *logging
  security_opt: ["no-new-privileges:true"]
  cap_drop: [ALL]

x-oneshot: &oneshot
  restart: "no"
  networks: [argus]
  logging: *logging
  security_opt: ["no-new-privileges:true"]
  cap_drop: [ALL]
  pids_limit: 128

x-seaweed: &seaweed
  image: ${SEAWEEDFS_IMAGE:?run node stack.js bootstrap}
  restart: unless-stopped
  networks: [argus]
  logging: *logging
  security_opt: ["no-new-privileges:true"]
  cap_drop: [ALL]
  read_only: true
  tmpfs: ["/tmp:size=32m,mode=1777"]
  pids_limit: 256

x-console-build: &console-build
  context: ../console
  dockerfile: server/Dockerfile
  args:
    NODE_IMAGE: ${NODE_IMAGE:?run node stack.js bootstrap}
    ARGUS_VERSION: ${ARGUS_VERSION:-0.1.0}

networks:
  argus:
    name: argus
    driver: bridge
    ipam:
      config:
        - subnet: ${ARGUS_SUBNET:-172.28.0.0/16}
  argus_socket:
    name: argus_socket
    driver: bridge
    internal: true
  argus_targets:
    name: argus_targets
    driver: bridge
    internal: true
  argus_nomad:
    name: argus_nomad
    driver: bridge

secrets:
  pg_superuser_password:  { file: ./secrets/pg_superuser_password }
  pg_exporter_password:   { file: ./secrets/pg_exporter_password }
  grafana_admin_password: { file: ./secrets/grafana_admin_password }
  grafana_db_password:    { file: ./secrets/grafana_db_password }
  console_alert_token:    { file: ./secrets/console_alert_token }
  console_metrics_token:  { file: ./secrets/console_metrics_token }

volumes:
  argus_seaweed_master:    { name: argus_seaweed_master }
  argus_seaweed_volume:    { name: argus_seaweed_volume }
  argus_seaweed_filer:     { name: argus_seaweed_filer }
  argus_seaweed_conf:      { name: argus_seaweed_conf }
  argus_seaweed_public:    { name: argus_seaweed_public }
  argus_pg_data:           { name: argus_pg_data }
  argus_garnet_data:       { name: argus_garnet_data }
  argus_nats_data:         { name: argus_nats_data }
  argus_openbao_data:      { name: argus_openbao_data }
  argus_openbao_logs:      { name: argus_openbao_logs }
  argus_openbao_seal:      { name: argus_openbao_seal }
  argus_console_state:     { name: argus_console_state }
  argus_console_audit:     { name: argus_console_audit }
  argus_prometheus_data:   { name: argus_prometheus_data }
  argus_mailpit_data:      { name: argus_mailpit_data }
  argus_alertmanager_data: { name: argus_alertmanager_data }
  argus_loki_data:         { name: argus_loki_data }
  argus_alloy_data:        { name: argus_alloy_data }
  argus_grafana_data:      { name: argus_grafana_data }
  argus_guac_recordings:   { name: argus_guac_recordings }
  argus_guac_drives:       { name: argus_guac_drives }
  argus_nomad_data:        { name: argus_nomad_data }
  argus_azurite_data:      { name: argus_azurite_data }
  argus_parity_results:    { name: argus_parity_results }

services:

  seaweed-config:
    <<: *seaweed
    restart: "no"
    container_name: argus-seaweed-config
    pids_limit: 64
    entrypoint: ["/bin/sh", "-euc"]
    command:
      - |
        umask 022
        : "$${ARGUS_S3_ADMIN_SECRET:?empty}"
        rm -f /etc/seaweedfs/filer.toml /etc/seaweedfs/s3.json /etc/seaweedfs/s3.json.tmp /public/s3-public.json /public/s3-public.json.tmp
        cat > /etc/seaweedfs/filer.toml <<'TOML'
        [leveldb2]
        enabled = true
        dir = "/data/filerldb2"
        TOML
        umask 077
        cat > /etc/seaweedfs/s3.json.tmp <<JSON
        { "identities": [
          { "name": "argus-admin",
            "credentials": [{ "accessKey": "argus-admin", "secretKey": "$${ARGUS_S3_ADMIN_SECRET}" }],
            "actions": ["Admin","Read","Write","List","Tagging"] },
          { "name": "argus-console",
            "credentials": [{ "accessKey": "argus-console", "secretKey": "$${ARGUS_S3_CONSOLE_SECRET}" }],
            "actions": ["Read:argus-uploads","List:argus-uploads","Write:argus-uploads",
              "Read:argus-rasters","List:argus-rasters","Write:argus-rasters",
              "Read:argus-sentinel","List:argus-sentinel","Write:argus-sentinel",
              "Read:argus-ml","List:argus-ml","Write:argus-ml",
              "Read:argus-artifacts","List:argus-artifacts","Write:argus-artifacts",
              "Read:argus-backups","List:argus-backups","Write:argus-backups",
              "Read:argus-logs","List:argus-logs","Write:argus-logs",
              "Read:argus-sessions","List:argus-sessions","Write:argus-sessions"] },
          { "name": "argus-app",
            "credentials": [{ "accessKey": "argus-app", "secretKey": "$${ARGUS_S3_APP_SECRET}" }],
            "actions": ["Read:argus-uploads","Write:argus-uploads","List:argus-uploads",
                        "Read:argus-rasters","Write:argus-rasters","List:argus-rasters",
                        "Read:argus-ml","Write:argus-ml","List:argus-ml",
                        "Read:argus-sentinel","Write:argus-sentinel","List:argus-sentinel",
                        "Read:argus-artifacts","Write:argus-artifacts","List:argus-artifacts"] },
          { "name": "argus-loki",
            "credentials": [{ "accessKey": "argus-loki", "secretKey": "$${ARGUS_S3_LOKI_SECRET}" }],
            "actions": ["Read:argus-logs","Write:argus-logs","List:argus-logs"] },
          { "name": "argus-guacamole",
            "credentials": [{ "accessKey": "argus-guacamole", "secretKey": "$${ARGUS_S3_GUAC_SECRET}" }],
            "actions": ["Read:argus-sessions","Write:argus-sessions","List:argus-sessions"] },
          { "name": "argus-parity",
            "credentials": [{ "accessKey": "argus-parity", "secretKey": "$${ARGUS_S3_PARITY_SECRET}" }],
            "actions": ["Read:argus-parity","Write:argus-parity","List:argus-parity","Tagging:argus-parity",
                        "Read:argus-parity-worm","Write:argus-parity-worm","List:argus-parity-worm"] },
          { "name": "argus-parity-deny",
            "credentials": [{ "accessKey": "argus-parity-deny", "secretKey": "$${ARGUS_S3_PARITY_DENY_SECRET}" }],
            "actions": ["Read:argus-parity","List:argus-parity"] },
          { "name": "argus-parity-admin",
            "credentials": [{ "accessKey": "argus-parity-admin", "secretKey": "$${ARGUS_S3_PARITY_ADMIN_SECRET}" }],
            "actions": ["Admin"] }
        ] }
        JSON
        mv /etc/seaweedfs/s3.json.tmp /etc/seaweedfs/s3.json
        umask 022
        sed -e 's/, *"secretKey": *"[^"]*"//' /etc/seaweedfs/s3.json > /public/s3-public.json.tmp
        if grep -q secretKey /public/s3-public.json.tmp; then echo "s3-public.json still carries a secretKey; refusing to publish it" >&2; exit 1; fi
        mv /public/s3-public.json.tmp /public/s3-public.json
        chmod 0400 /etc/seaweedfs/s3.json
        chmod 0444 /etc/seaweedfs/filer.toml /public/s3-public.json
        echo "wrote filer.toml and s3.json (root only) and s3-public.json (names, access keys and actions, no secret keys)"
    environment:
      ARGUS_S3_ADMIN_SECRET:       ${ARGUS_S3_ADMIN_SECRET:?run node stack.js bootstrap}
      ARGUS_S3_CONSOLE_SECRET:     ${ARGUS_S3_CONSOLE_SECRET:?run node stack.js bootstrap}
      ARGUS_S3_APP_SECRET:         ${ARGUS_S3_APP_SECRET:?run node stack.js bootstrap}
      ARGUS_S3_LOKI_SECRET:        ${ARGUS_S3_LOKI_SECRET:?run node stack.js bootstrap}
      ARGUS_S3_GUAC_SECRET:        ${ARGUS_S3_GUAC_SECRET:?run node stack.js bootstrap}
      ARGUS_S3_PARITY_SECRET:      ${ARGUS_S3_PARITY_SECRET:?run node stack.js bootstrap}
      ARGUS_S3_PARITY_DENY_SECRET: ${ARGUS_S3_PARITY_DENY_SECRET:?run node stack.js bootstrap}
      ARGUS_S3_PARITY_ADMIN_SECRET: ${ARGUS_S3_PARITY_ADMIN_SECRET:?run node stack.js bootstrap}
    volumes:
      - argus_seaweed_conf:/etc/seaweedfs
      - argus_seaweed_public:/public
    mem_limit: 64m

  seaweed-master:
    <<: *seaweed
    container_name: argus-seaweed-master
    command: >
      master -ip=seaweed-master -ip.bind=0.0.0.0 -port=9333 -mdir=/data
      -defaultReplication=000
      -volumeSizeLimitMB=${ARGUS_S3_VOLUME_SIZE_MB:-1024}
      -volumePreallocate=false -garbageThreshold=0.3 -metricsPort=9324
    volumes: [argus_seaweed_master:/data]
    mem_limit: 256m
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD-SHELL", "wget -q -T 3 -O /dev/null http://127.0.0.1:9333/cluster/healthz"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
      start_interval: 2s

  seaweed-volume:
    <<: *seaweed
    container_name: argus-seaweed-volume
    command: >
      volume -mserver=seaweed-master:9333 -ip=seaweed-volume -ip.bind=0.0.0.0
      -port=8080 -dir=/data -max=${ARGUS_S3_MAX_VOLUMES:-60}
      -index=leveldb -dataCenter=site-a -rack=compose -metricsPort=9325
    volumes: [argus_seaweed_volume:/data]
    mem_limit: 512m
    stop_grace_period: 60s
    depends_on:
      seaweed-master: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "wget -q -T 3 -O /dev/null http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
      start_interval: 2s

  seaweed-filer:
    <<: *seaweed
    container_name: argus-seaweed-filer
    command: >
      filer -master=seaweed-master:9333 -ip=seaweed-filer -ip.bind=0.0.0.0
      -port=8888 -defaultStoreDir=/data -metricsPort=9326
    volumes:
      - argus_seaweed_filer:/data
      - argus_seaweed_conf:/etc/seaweedfs:ro
    mem_limit: 384m
    stop_grace_period: 60s
    depends_on:
      seaweed-config: { condition: service_completed_successfully }
      seaweed-volume: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "wget -q -T 3 -O /dev/null 'http://127.0.0.1:8888/?limit=1'"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
      start_interval: 2s

  seaweed-s3:
    <<: *seaweed
    container_name: argus-seaweed-s3
    command: >
      s3 -filer=seaweed-filer:8888 -ip.bind=0.0.0.0 -port=8333
      -config=/etc/seaweedfs/s3.json -metricsPort=9327
    volumes:
      - argus_seaweed_conf:/etc/seaweedfs:ro
    mem_limit: 256m
    depends_on:
      seaweed-filer:  { condition: service_healthy }
      seaweed-config: { condition: service_completed_successfully }
    healthcheck:
      test: ["CMD-SHELL", "wget -q -T 3 -O /dev/null http://127.0.0.1:8333/healthz"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 25s
      start_interval: 2s

  storage-init:
    <<: *oneshot
    image: argus/console-api:${ARGUS_VERSION:-0.1.0}
    build: *console-build
    container_name: argus-storage-init
    init: true
    read_only: true
    tmpfs: ["/tmp:size=16m,mode=1777"]
    command: ["node", "/app/tools/init-object-storage.js"]
    environment:
      ARGUS_S3_ENDPOINT: http://seaweed-s3:8333
      ARGUS_S3_REGION: ${ARGUS_S3_REGION:-us-east-1}
      ARGUS_SEAWEED_MASTER_URL: http://seaweed-master:9333
      ARGUS_BUCKETS_FILE: /config/buckets.yaml
      ARGUS_S3_IDENTITIES_FILE: /config/seaweed-public/s3-public.json
      ARGUS_STATE_DIR: /state
      AWS_ACCESS_KEY_ID: argus-admin
      AWS_SECRET_ACCESS_KEY: ${ARGUS_S3_ADMIN_SECRET:?run node stack.js bootstrap}
      AWS_REQUEST_CHECKSUM_CALCULATION: when_required
      AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
      ARGUS_PROFILE: ${ARGUS_PROFILE:-dev}
      ARGUS_OBJECT_LOCK_DAYS: ${ARGUS_OBJECT_LOCK_DAYS:-1}
      ARGUS_DEV_LOCK_MODE: ${ARGUS_DEV_LOCK_MODE:-GOVERNANCE}
      ARGUS_WORM_PROBE_BUCKET: argus-worm-probe
    volumes:
      - ../gitops/storage/buckets.yaml:/config/buckets.yaml:ro
      - argus_console_state:/state
      - argus_seaweed_public:/config/seaweed-public:ro
    mem_limit: 192m
    depends_on:
      seaweed-s3: { condition: service_healthy }

  postgres:
    <<: *hardening
    image: ${POSTGIS_IMAGE:?run node stack.js bootstrap}
    container_name: argus-postgres
    hostname: postgres
    networks: [argus]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETGID, SETUID]
    read_only: true
    tmpfs:
      - /var/run/postgresql:size=8m,mode=2777
      - /tmp:size=64m,mode=1777
    shm_size: 256m
    stop_signal: SIGINT
    stop_grace_period: 120s
    command:
      - postgres
      - -c
      - shared_buffers=${PG_SHARED_BUFFERS:-256MB}
      - -c
      - effective_cache_size=${PG_EFFECTIVE_CACHE_SIZE:-768MB}
      - -c
      - work_mem=${PG_WORK_MEM:-8MB}
      - -c
      - max_connections=${PG_MAX_CONNECTIONS:-120}
      - -c
      - password_encryption=scram-sha-256
      - -c
      - shared_preload_libraries=pg_stat_statements
      - -c
      - track_io_timing=on
      - -c
      - log_min_duration_statement=1000
      - -c
      - huge_pages=off
    environment:
      TZ: ${TZ:-UTC}
      PGDATA: /var/lib/postgresql/data/pgdata
      POSTGRES_USER: postgres
      POSTGRES_DB: postgres
      POSTGRES_PASSWORD_FILE: /run/secrets/pg_superuser_password
      POSTGRES_INITDB_ARGS: "--data-checksums --encoding=UTF8"
    secrets: [pg_superuser_password]
    volumes:
      - argus_pg_data:/var/lib/postgresql/data
    mem_limit: 1024m
    pids_limit: 512
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -q -h 127.0.0.1 -p 5432 -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s
      start_interval: 2s

  pg-init:
    <<: *oneshot
    image: ${POSTGIS_IMAGE:?run node stack.js bootstrap}
    container_name: argus-pg-init
    pids_limit: 64
    read_only: true
    tmpfs: ["/tmp:size=16m,mode=1777"]
    environment:
      PGHOST: postgres
      PGUSER: postgres
      PGDATABASE: postgres
      PGPASSWORD_FILE: /run/secrets/pg_superuser_password
      ARGUS_PG_APP_PASSWORD:      ${ARGUS_PG_APP_PASSWORD:?run node stack.js bootstrap}
      ARGUS_PG_CONSOLE_PASSWORD:  ${ARGUS_PG_CONSOLE_PASSWORD:?run node stack.js bootstrap}
      ARGUS_PG_EXPORTER_PASSWORD: ${ARGUS_PG_EXPORTER_PASSWORD:?run node stack.js bootstrap}
      ARGUS_PG_GUAC_PASSWORD:     ${ARGUS_PG_GUAC_PASSWORD:?run node stack.js bootstrap}
      ARGUS_PG_GRAFANA_PASSWORD:  ${ARGUS_PG_GRAFANA_PASSWORD:?run node stack.js bootstrap}
      ARGUS_PG_PARITY_PASSWORD:   ${ARGUS_PG_PARITY_PASSWORD:?run node stack.js bootstrap}
    secrets: [pg_superuser_password]
    volumes:
      - ./sql:/sql:ro
    entrypoint: ["/bin/sh", "-c"]
    command:
      - 'export PGPASSWORD="$$(cat $$PGPASSWORD_FILE)"; i=0; until pg_isready -q -h postgres -p 5432 -U postgres; do i=$$((i+1)); [ $$i -ge 60 ] && { echo "postgres did not become ready in 120s" >&2; exit 1; }; sleep 2; done; psql -v ON_ERROR_STOP=1 -f /sql/00-roles-and-databases.sql && psql -v ON_ERROR_STOP=1 -f /sql/10-extensions.sql && psql -v ON_ERROR_STOP=1 -f /sql/20-grants.sql && echo "pg-init complete"'
    mem_limit: 128m
    depends_on:
      postgres: { condition: service_healthy }

  garnet:
    <<: *hardening
    profiles: [cache]
    image: ${GARNET_IMAGE:?run node stack.js bootstrap}
    container_name: argus-garnet
    hostname: garnet
    networks: [argus]
    read_only: true
    tmpfs: ["/tmp:size=32m,mode=1777"]
    command: ["--config-import-path=/etc/garnet/conf/garnet.conf"]
    volumes:
      - argus_garnet_data:/data
      - ./services/cache:/etc/garnet/conf:ro
      - ./secrets/garnet/users.acl:/etc/garnet/secrets/users.acl:ro
    mem_limit: ${GARNET_MEM_LIMIT:-768m}
    pids_limit: 256
    ulimits:
      memlock: -1
      nofile: { soft: 65535, hard: 65535 }
    healthcheck:
      test: ['CMD', 'bash', '-c', 'exec 3<>/dev/tcp/127.0.0.1/6379 && printf ''PING\r\n'' >&3 && head -c 7 <&3 | grep -qE "PONG|NOAUTH"']
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
      start_interval: 2s

  garnet-init:
    <<: *oneshot
    profiles: [cache]
    image: ${VALKEY_IMAGE:?run node stack.js bootstrap}
    container_name: argus-garnet-init
    pids_limit: 64
    read_only: true
    environment:
      GARNET_CONSOLE_PASSWORD: ${GARNET_CONSOLE_PASSWORD:?run node stack.js bootstrap}
    volumes:
      - ./services/cache/init.sh:/init.sh:ro
    entrypoint: ["/bin/sh", "/init.sh"]
    mem_limit: 64m
    depends_on:
      garnet: { condition: service_healthy }

  nats:
    <<: *hardening
    profiles: [queues, parity]
    image: ${NATS_IMAGE:?run node stack.js bootstrap}
    container_name: argus-nats
    hostname: nats
    networks: [argus]
    read_only: true
    tmpfs: ["/tmp:size=16m,mode=1777"]
    command: ["--config", "/etc/nats/nats-server.conf", "--name", "nats-1"]
    environment:
      NATS_ARGUS_PASSWORD: ${NATS_ARGUS_PASSWORD:?run node stack.js bootstrap}
      NATS_AGENT_PASSWORD: ${NATS_AGENT_PASSWORD:?run node stack.js bootstrap}
    volumes:
      - ./services/queues/nats-server.conf:/etc/nats/nats-server.conf:ro
      - argus_nats_data:/data
    mem_limit: 512m
    pids_limit: 256
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:8222/healthz?js-server-only=true"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 30s
      start_interval: 2s

  nats-init:
    <<: *oneshot
    profiles: [queues]
    image: ${NATS_BOX_IMAGE:?run node stack.js bootstrap}
    container_name: argus-nats-init
    pids_limit: 64
    read_only: true
    tmpfs: ["/tmp:size=8m,mode=1777"]
    environment:
      NATS_URL: nats://nats:4222
      NATS_USER: argus
      NATS_PASSWORD: ${NATS_ARGUS_PASSWORD:?run node stack.js bootstrap}
      ARGUS_NATS_REPLICAS: "1"
    volumes:
      - ./services/queues/init:/init:ro
    entrypoint: ["/bin/sh", "-c", "tr -d '\\r' < /init/apply.sh > /tmp/apply.sh && exec /bin/sh /tmp/apply.sh"]
    mem_limit: 128m
    depends_on:
      nats: { condition: service_healthy }

  openbao:
    <<: *hardening
    profiles: [secrets, parity]
    image: ${OPENBAO_IMAGE:?run node stack.js bootstrap}
    container_name: argus-openbao
    hostname: openbao
    networks: [argus]
    read_only: true
    tmpfs: ["/tmp:size=16m,mode=1777"]
    command: ["server", "-config=/etc/argus/config/openbao.hcl"]
    environment:
      BAO_ADDR: http://127.0.0.1:8200
      SKIP_CHOWN: "true"
      SKIP_SETCAP: "true"
    volumes:
      - argus_openbao_data:/openbao/file
      - argus_openbao_logs:/openbao/logs
      - ./services/secrets/config:/etc/argus/config:ro
    mem_limit: 256m
    pids_limit: 128
    healthcheck:
      test: ["CMD-SHELL", "bao status >/dev/null 2>&1"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 90s
      start_interval: 3s

  bao-init:
    <<: *oneshot
    profiles: [secrets]
    image: ${OPENBAO_IMAGE:?run node stack.js bootstrap}
    container_name: argus-bao-init
    user: "0:0"
    pids_limit: 64
    read_only: true
    tmpfs: ["/tmp:size=8m,mode=1777"]
    environment:
      BAO_ADDR: http://openbao:8200
      ARGUS_UNSEAL_MODE: ${ARGUS_UNSEAL_MODE:-sandbox}
    volumes:
      - argus_openbao_seal:/run/argus/seal
      - ./services/secrets/init:/etc/argus/init:ro
      - ../gitops/identity/openbao-policies:/etc/argus/policies:ro
    entrypoint: ["/bin/sh", "-c", "tr -d '\\r' < /etc/argus/init/provision.sh > /tmp/p.sh && exec /bin/sh /tmp/p.sh"]
    mem_limit: 128m
    depends_on:
      openbao: { condition: service_started }

  openbao-unseal:
    <<: *hardening
    profiles: [secrets]
    image: ${OPENBAO_IMAGE:?run node stack.js bootstrap}
    container_name: argus-openbao-unseal
    init: true
    user: "0:0"
    networks: [argus]
    read_only: true
    tmpfs: ["/tmp:size=8m,mode=1777"]
    environment:
      BAO_ADDR: http://openbao:8200
      ARGUS_UNSEAL_MODE: ${ARGUS_UNSEAL_MODE:-sandbox}
    volumes:
      - argus_openbao_seal:/run/argus/seal:ro
      - ./services/secrets/init:/etc/argus/init:ro
    entrypoint: ["/bin/sh", "-c", "tr -d '\\r' < /etc/argus/init/unseal-loop.sh > /tmp/u.sh && exec /bin/sh /tmp/u.sh"]
    mem_limit: 64m
    pids_limit: 32
    depends_on:
      openbao: { condition: service_started }

  console:
    <<: *hardening
    image: argus/console-api:${ARGUS_VERSION:-0.1.0}
    build: *console-build
    container_name: argus-console
    init: true
    networks: [argus, argus_socket, argus_nomad]
    read_only: true
    tmpfs: ["/tmp:size=16m,mode=1777"]
    environment:
      TZ: ${TZ:-UTC}
      ARGUS_HOST: "0.0.0.0"
      ARGUS_PORT: "8787"
      ARGUS_ALLOW_WRITES: ${ARGUS_ALLOW_WRITES:-0}
      ARGUS_ENVIRONMENT: ${ARGUS_ENVIRONMENT:-sandbox}
      ARGUS_WEB_ROOT: ../../prototype
      ARGUS_AUTH: session
      ARGUS_AUTH_OPERATORS_FILE: /config/operators.json
      ARGUS_AUTH_SECURE_COOKIES: ${ARGUS_AUTH_SECURE_COOKIES:-0}
      ARGUS_ALLOWED_HOSTS: console:8787,127.0.0.1:${CONSOLE_PORT:-8787},localhost:${CONSOLE_PORT:-8787}
      ARGUS_METRICS_TOKEN_FILE: /run/secrets/console_metrics_token
      ARGUS_DOCKER_PROXY_URL: ${ARGUS_DOCKER_PROXY_URL:-http://docker-socket-proxy:2375}
      ARGUS_SEAWEED_MASTER_URL: http://seaweed-master:9333
      ARGUS_SEAWEED_FILER_URL: http://seaweed-filer:8888
      ARGUS_S3_ENDPOINT: http://seaweed-s3:8333
      ARGUS_S3_REGION: ${ARGUS_S3_REGION:-us-east-1}
      ARGUS_BUCKETS_FILE: /config/buckets.yaml
      ARGUS_STATE_DIR: /state
      ARGUS_AUDIT_DIR: /audit
      ARGUS_GITOPS_DIR: /config/gitops
      ARGUS_RUNBOOKS_DIR: /config/runbooks
      ARGUS_S3_IDENTITIES_FILE: /config/seaweed-public/s3-public.json
      ARGUS_S3_ACCESS_KEY_ID: argus-console
      AWS_EC2_METADATA_DISABLED: "true"
      ARGUS_S3_SECRET_ACCESS_KEY: ${ARGUS_S3_CONSOLE_SECRET:?run node stack.js bootstrap}
      AWS_REQUEST_CHECKSUM_CALCULATION: when_required
      AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
      ARGUS_PG_HOST: postgres
      ARGUS_PG_USER: argus_console
      ARGUS_PG_PASSWORD: ${ARGUS_PG_CONSOLE_PASSWORD:?run node stack.js bootstrap}
      ARGUS_GARNET_HOST: garnet
      ARGUS_GARNET_PORT: "6379"
      ARGUS_GARNET_USER: console
      ARGUS_GARNET_PASSWORD: ${GARNET_CONSOLE_PASSWORD:?run node stack.js bootstrap}
      ARGUS_GARNET_MEM_LIMIT_BYTES: ${ARGUS_GARNET_MEM_LIMIT_BYTES:-805306368}
      ARGUS_NATS_MONITOR_URL: http://nats:8222
      ARGUS_NATS_URL: nats://nats:4222
      ARGUS_NATS_USER: agent
      ARGUS_NATS_PASSWORD: ${NATS_AGENT_PASSWORD:?run node stack.js bootstrap}
      ARGUS_OPENBAO_ADDR: http://openbao:8200
      ARGUS_UNSEAL_MODE: ${ARGUS_UNSEAL_MODE:-sandbox}
      ARGUS_PROM_URL: ${ARGUS_PROM_URL:-http://prometheus:9090}
      ARGUS_LOKI_URL: ${ARGUS_LOKI_URL:-http://loki:3100}
      ARGUS_ALERTMANAGER_URL: ${ARGUS_ALERTMANAGER_URL:-http://alertmanager:9093}
      ARGUS_GUACAMOLE_BASE: ${ARGUS_GUACAMOLE_BASE:-http://guacamole:8080/guacamole}
      ARGUS_PARITY_URL: ${ARGUS_PARITY_URL:-http://parity:9781}
      ARGUS_NOMAD_URL: ${ARGUS_NOMAD_URL:-http://nomad:4646}
      ARGUS_UPSTREAM_TIMEOUT_MS: ${ARGUS_UPSTREAM_TIMEOUT_MS:-8000}
    secrets:
      - source: console_metrics_token
        target: console_metrics_token
    volumes:
      - ../gitops:/config/gitops:ro
      - ../gitops/storage/buckets.yaml:/config/buckets.yaml:ro
      - ./secrets/operators.json:/config/operators.json:ro
      - ../../docs/runbooks:/config/runbooks:ro
      - argus_seaweed_public:/config/seaweed-public:ro
      - argus_console_state:/state:ro
      - argus_console_audit:/audit
    ports: ["127.0.0.1:${CONSOLE_PORT:-8787}:8787"]
    mem_limit: 320m
    pids_limit: 512
    depends_on:
      seaweed-s3:   { condition: service_healthy }
      storage-init: { condition: service_completed_successfully }
      pg-init:      { condition: service_completed_successfully }
    healthcheck:
      test: ["CMD", "node", "-e", "const h=require('node:http');const t=setTimeout(()=>process.exit(1),4000);t.unref();h.get('http://127.0.0.1:8787/api/health',r=>{r.resume();process.exit(r.statusCode===200?0:1)}).on('error',()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 20s
      start_interval: 2s

  docker-socket-proxy:
    <<: *hardening
    image: ${SOCKET_PROXY_IMAGE:?run node stack.js bootstrap}
    container_name: argus-docker-socket-proxy
    hostname: docker-socket-proxy
    user: "0:0"
    networks: [argus_socket]
    read_only: true
    command:
      - -loglevel=warn
      - -listenip=0.0.0.0
      - -proxyport=2375
      - -allowfrom=console,alloy
      - -allowhealthcheck
      - -shutdowngracetime=5
      - -watchdoginterval=300
      - -stoponwatchdog
      - -allowGET=(/v1\.[0-9]+)?/(_ping|version|info|containers/json|containers/[a-zA-Z0-9_.-]+/(json|stats|logs)|events|networks)
      - -allowHEAD=(/v1\.[0-9]+)?/(_ping|version|info|containers/json|containers/[a-zA-Z0-9_.-]+/(json|stats|logs)|events|networks)
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    mem_limit: 32m
    pids_limit: 64
    healthcheck:
      test: ["CMD", "./healthcheck"]
      interval: 15s
      timeout: 3s
      retries: 5
      start_period: 10s
      start_interval: 2s

  prometheus:
    <<: *hardening
    profiles: [observability]
    image: ${PROMETHEUS_IMAGE:?run node stack.js bootstrap}
    container_name: argus-prometheus
    networks: [argus]
    read_only: true
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=${PROM_RETENTION_TIME:-15d}
      - --storage.tsdb.retention.size=${PROM_RETENTION_SIZE:-6GB}
      - --storage.tsdb.wal-compression
      - --web.listen-address=0.0.0.0:9090
      - --query.timeout=30s
      - --query.max-samples=5000000
    environment:
      ARGUS_SITE: ${ARGUS_SITE:-site-a}
      ARGUS_ENVIRONMENT: ${ARGUS_ENVIRONMENT:-sandbox}
    secrets:
      - source: console_metrics_token
        target: console_metrics_token
    volumes:
      - argus_prometheus_data:/prometheus
      - ./services/observability/prometheus:/etc/prometheus:ro
      - ../gitops:/gitops:ro
    mem_limit: 1536m
    pids_limit: 256
    healthcheck:
      test: ["CMD", "promtool", "check", "ready", "--url=http://127.0.0.1:9090"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 120s
      start_interval: 3s

  alertmanager:
    <<: *hardening
    profiles: [observability]
    image: ${ALERTMANAGER_IMAGE:?run node stack.js bootstrap}
    container_name: argus-alertmanager
    networks: [argus]
    read_only: true
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
      - --web.listen-address=0.0.0.0:9093
    volumes:
      - argus_alertmanager_data:/alertmanager
      - ./secrets/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    secrets: [console_alert_token]
    mem_limit: 128m
    pids_limit: 128
    depends_on:
      mailpit: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://127.0.0.1:9093/-/ready >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
      start_interval: 2s

  mailpit:
    <<: *hardening
    profiles: [observability]
    image: ${MAILPIT_IMAGE:?run node stack.js bootstrap}
    container_name: argus-mailpit
    networks: [argus]
    read_only: true
    tmpfs: ["/tmp:size=16m,mode=1777"]
    environment:
      TZ: ${TZ:-UTC}
      MP_SMTP_BIND_ADDR: 0.0.0.0:1025
      MP_UI_BIND_ADDR: 0.0.0.0:8025
      MP_MAX_MESSAGES: "2000"
      MP_DATABASE: /data/mailpit.db
      MP_SMTP_AUTH_ACCEPT_ANY: "true"
      MP_SMTP_AUTH_ALLOW_INSECURE: "true"
    volumes:
      - argus_mailpit_data:/data
    mem_limit: 128m
    pids_limit: 128
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://127.0.0.1:8025/readyz >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
      start_interval: 2s

  loki:
    <<: *hardening
    profiles: [observability]
    image: ${LOKI_IMAGE:?run node stack.js bootstrap}
    container_name: argus-loki
    networks: [argus]
    read_only: true
    tmpfs: ["/tmp:size=32m,mode=1777"]
    command: ["-config.file=/etc/loki/loki.yaml", "-config.expand-env=true"]
    environment:
      LOKI_RETENTION_DEFAULT: ${LOKI_RETENTION_DEFAULT:-360h}
    volumes:
      - argus_loki_data:/loki
      - ./services/observability/loki/loki.yaml:/etc/loki/loki.yaml:ro
    mem_limit: 768m
    pids_limit: 256
    stop_grace_period: 60s
    healthcheck:
      test: ["CMD", "/busybox/sh", "-c", "wget -q -O- http://127.0.0.1:3100/ready | grep -q ready"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s
      start_interval: 3s

  alloy:
    <<: *hardening
    profiles: [observability]
    image: ${ALLOY_IMAGE:?run node stack.js bootstrap}
    container_name: argus-alloy
    hostname: alloy
    user: "473:473"
    networks: [argus, argus_socket]
    read_only: true
    tmpfs: ["/tmp:size=32m,mode=1777"]
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      - --disable-reporting
      - /etc/alloy/config.alloy
    environment:
      DOCKER_HOST: tcp://docker-socket-proxy:2375
      LOKI_URL: http://loki:3100/loki/api/v1/push
      ARGUS_SITE: ${ARGUS_SITE:-site-a}
      ARGUS_ENVIRONMENT: ${ARGUS_ENVIRONMENT:-sandbox}
    volumes:
      - argus_alloy_data:/var/lib/alloy/data
      - ./services/observability/alloy/config.alloy:/etc/alloy/config.alloy:ro
    mem_limit: 256m
    pids_limit: 256
    depends_on:
      loki: { condition: service_healthy }
      docker-socket-proxy: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/12345; printf \"GET /-/ready HTTP/1.0\\r\\n\\r\\n\" >&3; head -n 1 <&3 | grep -q \" 200 \"'"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 30s
      start_interval: 3s

  grafana:
    <<: *hardening
    profiles: [observability]
    image: ${GRAFANA_IMAGE:?run node stack.js bootstrap}
    container_name: argus-grafana
    networks: [argus]
    read_only: true
    tmpfs: ["/tmp:size=64m,mode=1777"]
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-argus-admin}
      GF_SECURITY_ADMIN_PASSWORD__FILE: /run/secrets/grafana_admin_password
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_SECURITY_ALLOW_EMBEDDING: "false"
      GF_SECURITY_COOKIE_SAMESITE: strict
      GF_UNIFIED_ALERTING_ENABLED: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
      GF_INSTALL_PLUGINS: ""
      GF_PATHS_PROVISIONING: /etc/grafana/provisioning
      GF_DATABASE_TYPE: postgres
      GF_DATABASE_HOST: postgres:5432
      GF_DATABASE_NAME: grafana
      GF_DATABASE_USER: grafana
      GF_DATABASE_PASSWORD__FILE: /run/secrets/grafana_db_password
      GF_DATABASE_SSL_MODE: disable
    secrets: [grafana_admin_password, grafana_db_password]
    volumes:
      - argus_grafana_data:/var/lib/grafana
      - ./services/observability/grafana/provisioning:/etc/grafana/provisioning:ro
    ports: ["127.0.0.1:${GRAFANA_PORT:-3000}:3000"]
    mem_limit: 384m
    pids_limit: 512
    depends_on:
      prometheus: { condition: service_healthy }
      loki:       { condition: service_healthy }
      postgres:   { condition: service_healthy }
      pg-init:    { condition: service_completed_successfully }
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:3000/api/health | grep -q '\"database\": *\"ok\"' || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 45s
      start_interval: 3s

  node-exporter:
    <<: *hardening
    profiles: [observability]
    image: ${NODE_EXPORTER_IMAGE:?run node stack.js bootstrap}
    container_name: argus-node-exporter
    networks: [argus]
    command:
      - --path.procfs=/host/proc
      - --path.sysfs=/host/sys
      - --path.rootfs=/rootfs
      - --collector.filesystem.mount-points-exclude=^/(dev|proc|sys|run|var/lib/docker/.+)($$|/)
      - --collector.filesystem.fs-types-exclude=^(autofs|binfmt_misc|cgroup2?|devpts|overlay|proc|sysfs|tmpfs|tracefs|9p|virtiofs)$$
      - --no-collector.wifi
      - --no-collector.hwmon
    pid: host
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    read_only: true
    mem_limit: 64m
    pids_limit: 64
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://127.0.0.1:9100/metrics >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
      start_interval: 2s

  postgres-exporter:
    <<: *hardening
    profiles: [observability]
    image: ${PG_EXPORTER_IMAGE:?run node stack.js bootstrap}
    container_name: argus-postgres-exporter
    networks: [argus]
    command:
      - --auto-discover-databases
      - --exclude-databases=template0,template1
      - --collector.stat_statements
    environment:
      DATA_SOURCE_URI: "postgres:5432/postgres?sslmode=disable"
      DATA_SOURCE_USER: argus_exporter
      DATA_SOURCE_PASS_FILE: /run/secrets/pg_exporter_password
    secrets: [pg_exporter_password]
    read_only: true
    mem_limit: 96m
    pids_limit: 64
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://127.0.0.1:9187/metrics | grep -q '^pg_up 1$$' || exit 1"]
      interval: 30s
      timeout: 8s
      retries: 3
      start_period: 20s
      start_interval: 3s
    depends_on:
      postgres: { condition: service_healthy }
      pg-init:  { condition: service_completed_successfully }

  garnet-exporter:
    <<: *hardening
    profiles: [observability]
    image: ${REDIS_EXPORTER_IMAGE:?run node stack.js bootstrap}
    container_name: argus-garnet-exporter
    networks: [argus]
    environment:
      REDIS_ADDR: redis://garnet:6379
      REDIS_USER: console
      REDIS_PASSWORD: ${GARNET_CONSOLE_PASSWORD:?run node stack.js bootstrap}
      REDIS_EXPORTER_INCL_SYSTEM_METRICS: "false"
    read_only: true
    mem_limit: 96m
    pids_limit: 64
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://127.0.0.1:9121/metrics | grep -q '^redis_exporter_build_info' || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
      start_interval: 2s

  nats-exporter:
    <<: *hardening
    profiles: [observability]
    image: ${NATS_EXPORTER_IMAGE:?run node stack.js bootstrap}
    container_name: argus-nats-exporter
    networks: [argus]
    command: ["-port=7777", "-varz", "-connz", "-routez", "-healthz", "-jsz=all", "http://nats:8222"]
    read_only: true
    mem_limit: 96m
    pids_limit: 64
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://127.0.0.1:7777/metrics >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
      start_interval: 2s

  guacd:
    <<: *hardening
    profiles: [connect]
    image: ${GUACD_IMAGE:?run node stack.js bootstrap}
    container_name: argus-guacd
    networks: [argus, argus_targets]
    read_only: true
    tmpfs: ["/tmp:size=64m,mode=1777"]
    environment:
      GUACD_LOG_LEVEL: info
    volumes:
      - argus_guac_recordings:/recordings
      - argus_guac_drives:/drives
    mem_limit: 512m
    pids_limit: 256
    expose: ["4822"]
    depends_on:
      guac-storage-init: { condition: service_completed_successfully }
    healthcheck:
      test: ["CMD-SHELL", "printf '6.select,3.ssh;' | nc -w 3 127.0.0.1 4822 | grep -q args"]
      interval: 15s
      timeout: 8s
      retries: 4
      start_period: 15s
      start_interval: 2s

  guac-storage-init:
    <<: *oneshot
    profiles: [connect]
    image: ${ALPINE_IMAGE:?run node stack.js bootstrap}
    container_name: argus-guac-storage-init
    cap_add: [CHOWN, FOWNER]
    pids_limit: 32
    read_only: true
    command:
      - sh
      - -c
      - |
        set -eu
        for d in /recordings /drives; do
          mkdir -p "$$d"; chown 1000:1000 "$$d"; chmod 0770 "$$d"
          o=$$(stat -c %u "$$d"); [ "$$o" = "1000" ] || { echo "$$d is uid $$o, not 1000" >&2; exit 1; }
        done
        echo "recording volumes ready"
    volumes:
      - argus_guac_recordings:/recordings
      - argus_guac_drives:/drives
    mem_limit: 32m

  guacamole:
    <<: *hardening
    profiles: [connect]
    image: ${GUACAMOLE_IMAGE:?run node stack.js bootstrap}
    container_name: argus-guacamole
    networks: [argus]
    environment:
      GUACD_HOSTNAME: guacd
      GUACD_PORT: "4822"
      POSTGRESQL_HOSTNAME: postgres
      POSTGRESQL_PORT: "5432"
      POSTGRESQL_DATABASE: guacamole_db
      POSTGRESQL_USER: guacamole_user
      POSTGRESQL_PASSWORD: ${ARGUS_PG_GUAC_PASSWORD:?run node stack.js bootstrap}
      POSTGRESQL_AUTO_CREATE_ACCOUNTS: "false"
      JSON_SECRET_KEY: ${GUAC_JSON_SECRET_KEY:?run node stack.js bootstrap}
      JSON_TRUSTED_NETWORKS: ${ARGUS_SUBNET:-172.28.0.0/16}
      EXTENSION_PRIORITY: json
      REMOTE_IP_VALVE_ENABLED: "true"
      PROXY_ALLOWED_IPS_REGEX: ${ARGUS_SUBNET_REGEX:?run node stack.js bootstrap}
    mem_limit: 768m
    pids_limit: 512
    expose: ["8080"]
    depends_on:
      postgres:  { condition: service_healthy }
      guac-init: { condition: service_completed_successfully }
      guacd:     { condition: service_healthy }
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET /guacamole/api/languages HTTP/1.0\\r\\nHost: localhost\\r\\n\\r\\n' >&3 && timeout 8 head -c 256 <&3 | grep -qm1 '^HTTP/1\\.[01] 200'"]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 120s
      start_interval: 3s

  guac-init:
    <<: *oneshot
    profiles: [connect]
    image: ${GUACAMOLE_IMAGE:?run node stack.js bootstrap}
    container_name: argus-guac-init
    read_only: true
    tmpfs: ["/tmp:size=64m,mode=1777"]
    environment:
      PGHOST: postgres
      PGUSER: guacamole_user
      PGDATABASE: guacamole_db
      PGPASSWORD: ${ARGUS_PG_GUAC_PASSWORD:?run node stack.js bootstrap}
      BREAKGLASS_USER: ${GUAC_BREAKGLASS_USER:-argus-breakglass}
      BREAKGLASS_SALT_HEX: ${GUAC_BREAKGLASS_SALT_HEX:?run node stack.js bootstrap}
      BREAKGLASS_HASH_HEX: ${GUAC_BREAKGLASS_HASH_HEX:?run node stack.js bootstrap}
    volumes:
      - ./services/connect/sql:/seed:ro
    entrypoint: ["/bin/sh", "-c", "tr -d '\\r' < /seed/init.sh > /tmp/i.sh && exec /bin/sh /tmp/i.sh"]
    mem_limit: 256m
    depends_on:
      postgres: { condition: service_healthy }
      pg-init:  { condition: service_completed_successfully }

  target-ssh:
    <<: *hardening
    profiles: [targets]
    image: ${OPENSSH_IMAGE:?run node stack.js bootstrap}
    container_name: argus-target-ssh
    networks: [argus_targets]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETGID, SETUID, KILL, SYS_CHROOT, AUDIT_WRITE]
    environment:
      PUID: "1000"
      PGID: "1000"
      TZ: ${TZ:-UTC}
      USER_NAME: argusops
      SUDO_ACCESS: "false"
      PASSWORD_ACCESS: "true"
      USER_PASSWORD: ${TARGET_SSH_PASSWORD:?run node stack.js bootstrap}
    mem_limit: 128m
    pids_limit: 128
    expose: ["2222"]

  target-rdp:
    <<: *hardening
    profiles: [targets]
    image: ${RDESKTOP_IMAGE:?run node stack.js bootstrap}
    container_name: argus-target-rdp
    networks: [argus_targets]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, FSETID, SETGID, SETUID, KILL, SYS_CHROOT, AUDIT_WRITE, NET_BIND_SERVICE]
    environment:
      PUID: "1000"
      PGID: "1000"
      TZ: ${TZ:-UTC}
    mem_limit: 1024m
    pids_limit: 1024
    shm_size: 512m
    expose: ["3389"]

  nomad:
    profiles: [compute]
    image: ${NOMAD_IMAGE:?run node stack.js bootstrap}
    container_name: argus-nomad
    hostname: nomad
    restart: unless-stopped
    networks: [argus_nomad]
    logging: *logging
    command: ["agent", "-config=/etc/nomad.d"]
    environment:
      NOMAD_ADDR: http://127.0.0.1:4646
    volumes:
      - ${ARGUS_NOMAD_DATA:-argus_nomad_data}:/opt/argus/nomad/data
      - ./services/compute/nomad.d:/etc/nomad.d:ro
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
      - /var/run/docker.sock:/var/run/docker.sock
    cgroup: host
    pid: host
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, FSETID, KILL, SETGID, SETUID, SETPCAP, MKNOD, SYS_ADMIN, SYS_CHROOT, NET_BIND_SERVICE]
    security_opt: ["apparmor:unconfined"]
    mem_limit: 1024m
    pids_limit: 1024
    stop_grace_period: 60s
    healthcheck:
      test: ["CMD-SHELL", "nomad operator api /v1/agent/health >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s
      start_interval: 3s

  nomad-acl-init:
    <<: *oneshot
    profiles: [compute]
    image: ${NOMAD_IMAGE:?run node stack.js bootstrap}
    container_name: argus-nomad-acl-init
    networks: [argus_nomad]
    cap_add: [DAC_OVERRIDE]
    pids_limit: 32
    read_only: true
    environment:
      NOMAD_ADDR: http://nomad:4646
    volumes:
      - ./secrets/nomad_token:/out/nomad_token
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -u
        if [ -s /out/nomad_token ]; then
          if NOMAD_TOKEN="$$(cat /out/nomad_token)" nomad acl token self >/dev/null 2>&1; then
            echo "nomad ACL already bootstrapped; secrets/nomad_token holds a valid management token"
            exit 0
          fi
        fi
        out=$$(nomad acl bootstrap -t '{{ .SecretID }}' 2>&1)
        rc=$$?
        if [ "$$rc" -eq 0 ] && [ -n "$$out" ]; then
          printf '%s' "$$out" > /out/nomad_token
          echo "nomad ACL bootstrapped; the management token is in secrets/nomad_token"
          exit 0
        fi
        case "$$out" in
          *"already done"*|*"bootstrap already"*)
            echo "nomad ACL was bootstrapped earlier but secrets/nomad_token holds no valid token. Reset it with 'nomad acl bootstrap' after an ACL reset (see the compute README)." >&2
            exit 1 ;;
        esac
        echo "nomad acl bootstrap failed (exit $$rc)" >&2
        exit 1
    mem_limit: 64m
    depends_on:
      nomad: { condition: service_healthy }

  azurite:
    <<: *hardening
    profiles: [compute]
    image: ${AZURITE_IMAGE:?run node stack.js bootstrap}
    container_name: argus-azurite
    networks: [argus]
    read_only: true
    tmpfs: ["/tmp:size=32m,mode=1777"]
    command: ["azurite", "--location=/data", "--blobHost=0.0.0.0", "--queueHost=0.0.0.0", "--tableHost=0.0.0.0"]
    environment:
      AZURITE_ACCOUNTS: "argus:${AZURITE_ACCOUNT_KEY:?run node stack.js bootstrap}"
    volumes:
      - argus_azurite_data:/data
    mem_limit: 512m
    pids_limit: 256
    healthcheck:
      test: ["CMD-SHELL", "node -e \"const n=require('net');let l=3;for(const p of [10000,10001,10002]){const s=n.connect(p,'127.0.0.1');s.on('connect',()=>{s.end();if(--l===0)process.exit(0)});s.on('error',()=>process.exit(1))}\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s
      start_interval: 2s

  parity:
    <<: *hardening
    profiles: [parity]
    image: argus/console-api:${ARGUS_VERSION:-0.1.0}
    build: *console-build
    container_name: argus-parity
    hostname: parity
    networks: [argus]
    init: true
    user: "1000:1000"
    working_dir: /opt/argus/parity
    read_only: true
    tmpfs: ["/tmp:size=32m,mode=1777"]
    entrypoint: []
    environment:
      TZ: ${TZ:-UTC}
      NODE_PATH: /app/node_modules
      ARGUS_PARITY_SERVE: "1"
      ARGUS_PARITY_BIND: "0.0.0.0"
      ARGUS_PARITY_PORT: "9781"
      ARGUS_PARITY_INTERVAL_MS: "900000"
      ARGUS_PARITY_RESULTS_DIR: /var/lib/argus/parity
      ARGUS_PARITY_SDK_REQUIRED: "1"
      ARGUS_S3_ENDPOINT: http://seaweed-s3:8333
      ARGUS_S3_REGION: ${ARGUS_S3_REGION:-us-east-1}
      ARGUS_S3_BUCKET: argus-parity
      ARGUS_S3_WORM_BUCKET: argus-parity-worm
      ARGUS_S3_WORM_RETAIN_SECONDS: "120"
      ARGUS_S3_FORBIDDEN_BUCKET: argus-parity-forbidden
      ARGUS_PARITY_ACCESS_KEY: argus-parity
      ARGUS_PARITY_SECRET_KEY: ${ARGUS_S3_PARITY_SECRET:?run node stack.js bootstrap}
      ARGUS_PARITY_DENY_ACCESS_KEY: argus-parity-deny
      ARGUS_PARITY_DENY_SECRET_KEY: ${ARGUS_S3_PARITY_DENY_SECRET:?run node stack.js bootstrap}
      ARGUS_PARITY_ADMIN_ACCESS_KEY: argus-parity-admin
      ARGUS_PARITY_ADMIN_SECRET_KEY: ${ARGUS_S3_PARITY_ADMIN_SECRET:?run node stack.js bootstrap}
      ARGUS_PARITY_REPORT: /var/lib/argus/parity/latest.json
      ARGUS_PARITY_TIMEOUT_MS: "15000"
      ARGUS_PARITY_REFERENCE_ENDPOINT: ${ARGUS_PARITY_REFERENCE_ENDPOINT:-http://localstack:4566}
      ARGUS_PARITY_REFERENCE_ACCESS_KEY: ${ARGUS_PARITY_REFERENCE_ACCESS_KEY:-test}
      ARGUS_PARITY_REFERENCE_SECRET_KEY: ${ARGUS_PARITY_REFERENCE_SECRET_KEY:-test}
      ARGUS_NATS_URL: nats://nats:4222
      ARGUS_OPENBAO_ADDR: http://openbao:8200
    volumes:
      - ./services/parity:/opt/argus/parity:ro
      - argus_parity_results:/var/lib/argus/parity
    command: ["node", "src/runner.js"]
    mem_limit: 384m
    pids_limit: 256
    depends_on:
      seaweed-s3:       { condition: service_healthy }
      nats:             { condition: service_healthy }
      openbao:          { condition: service_healthy }
      parity-reference: { condition: service_healthy }
      parity-pg:        { condition: service_healthy }
    healthcheck:
      test: ["CMD", "node", "-e", "const h=require('node:http');const t=setTimeout(()=>process.exit(1),4000);t.unref();h.get('http://127.0.0.1:9781/healthz',r=>{r.resume();process.exit(r.statusCode===200?0:1)}).on('error',()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 180s
      start_interval: 5s

  parity-reference:
    <<: *hardening
    profiles: [parity]
    image: ${LOCALSTACK_IMAGE:?run node stack.js bootstrap}
    container_name: argus-parity-reference
    hostname: localstack
    networks: [argus]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETGID, SETUID, KILL]
    environment:
      TZ: ${TZ:-UTC}
      SERVICES: s3
      DEBUG: ${ARGUS_PARITY_REFERENCE_DEBUG:-0}
      EAGER_SERVICE_LOADING: "1"
      LOCALSTACK_HOST: localstack:4566
      AWS_DEFAULT_REGION: ${ARGUS_S3_REGION:-us-east-1}
    volumes:
      - ./services/parity/localstack-init:/etc/localstack/init/ready.d:ro
    tmpfs:
      - /var/lib/localstack:size=512m
      - /tmp:size=256m
    mem_limit: 1536m
    pids_limit: 512
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:4566/_localstack/init/ready | grep -q '\"completed\": *true'"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 90s
      start_interval: 3s

  parity-pg:
    <<: *hardening
    profiles: [parity]
    image: ${POSTGIS_IMAGE:?run node stack.js bootstrap}
    container_name: argus-parity-pg
    networks: [argus]
    init: true
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER]
    read_only: true
    tmpfs: ["/tmp:size=16m,mode=1777"]
    environment:
      TZ: ${TZ:-UTC}
      PGHOST: postgres
      PGDATABASE: argus_parity
      PGUSER: argus_parity
      PGPASSWORD: ${ARGUS_PG_PARITY_PASSWORD:?run node stack.js bootstrap}
      PGCONNECT_TIMEOUT: "10"
      ARGUS_PARITY_INTERVAL_S: "900"
    volumes:
      - ./services/parity/pg:/opt/argus/pg:ro
      - argus_parity_results:/var/lib/argus/parity
    entrypoint: ["/bin/sh", "-c"]
    command:
      - 'mkdir -p /var/lib/argus/parity/pg; chown -R 1000:1000 /var/lib/argus/parity; while true; do psql -v ON_ERROR_STOP=1 -qtAX -f /opt/argus/pg/canary.sql > /var/lib/argus/parity/pg/latest.json.tmp 2>/var/lib/argus/parity/pg/last-error.txt && mv -f /var/lib/argus/parity/pg/latest.json.tmp /var/lib/argus/parity/pg/latest.json; sleep "$$ARGUS_PARITY_INTERVAL_S"; done'
    mem_limit: 128m
    pids_limit: 64
    depends_on:
      postgres: { condition: service_healthy }
      pg-init:  { condition: service_completed_successfully }
    healthcheck:
      test: ["CMD-SHELL", "test -f /var/lib/argus/parity/pg/latest.json && test $$(( $$(date +%s) - $$(stat -c %Y /var/lib/argus/parity/pg/latest.json) )) -lt 2700"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 120s
      start_interval: 5s
