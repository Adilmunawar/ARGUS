# ══════════════════════════════════════════════ Argus queues: NATS JetStream
# The SQS + SNS + EventBridge replacement (ADR-0010), as one server.
#
# THERE IS NO CREDENTIAL IN THIS FILE AND THERE IS NOWHERE TO PUT ONE.
# Every password below is a `$VAR` that NATS expands from the SERVER PROCESS's
# environment, which docker-compose.yml fills from .env (gitignored). NATS
# refuses to start when a referenced variable is unset -- measured: it exits 1
# with "variable reference for 'NATS_AGENT_PASSWORD' on line <n> can not be
# found", naming this file's own line, rather than starting with a blank or a
# default password. That failure mode is the reason
# this file is written this way: a literal here would be committed to git, be
# identical on every machine that clones the repository, and stay valid until
# somebody noticed.
#
# THE NUMBERS BELOW ARE PINNED BECAUSE THE DEFAULTS ARE "EVERYTHING".
# JetStream with no limits sizes itself against the whole machine: 75% of RAM
# for the memory store and as much disk as the filesystem will give it. Inside
# WSL2 that filesystem is the ext4 VHDX shared with Postgres, SeaweedFS, the
# Prometheus TSDB and the Docker image cache -- and a VHDX that fills does not
# shrink again when the data is deleted. One runaway publisher would therefore
# cost the whole estate, permanently, and the first symptom would be Postgres
# refusing writes rather than anything pointing at NATS. Every number here is
# derived from the container's `mem_limit: 512m` in docker-compose.yml and from
# a deliberate 2 GB budget on that shared disk.

# ───────────────────────────────────────────────────────────────── listeners
# 0.0.0.0, not 127.0.0.1: inside a container a loopback bind answers nothing
# that comes through the published port. Host exposure is confined by the
# `127.0.0.1:4222` publish in docker-compose.yml, not by the bind address.
host: "0.0.0.0"
port: 4222

# THE MONITORING PORT IS NOT OPTIONAL HERE. Three things break without it and
# none of them names this line: the container healthcheck wgets
# /healthz?js-server-only=true and the container is permanently unhealthy, so
# nats-init never runs; nats-exporter (`-varz -connz -jsz=all`) scrapes 8222 and
# reports the server as down; and the console's queues screen reads /jsz for
# stream state. `http` is the plaintext listener -- correct on a private bridge
# network, and the reason 8222 is published to 127.0.0.1 only.
http: "0.0.0.0:8222"

# `server_name` is deliberately NOT set here. docker-compose.yml passes
# `--name nats-1` on the command line and a command-line flag wins over the
# config, so setting it in both places creates a value that looks authoritative
# and is ignored -- which is exactly how a node ends up logging under a name
# nobody can find in the compose file.

# ──────────────────────────────────────────────────────────── server limits
# 1 MB is the NATS default, restated so that raising it is a deliberate act
# with this comment attached. A message is held in memory on the way in, on the
# way out, and again in the JetStream write path, so the payload ceiling and the
# memory pin below are the same budget. Argus jobs are POINTERS: a shapefile
# ingest publishes the S3 key of the upload, never the shapefile. If a producer
# hits this, the fix is to put the bytes in argus-artifacts and publish the key,
# not to raise this number.
max_payload: 1MB

# A bound on how much this server will buffer for ONE client before it
# disconnects it as a slow consumer. The default is 64MB per connection, which
# inside a 512 MB container means eight stalled subscribers can OOM-kill the
# broker. 8 MB disconnects them early instead -- and for JetStream PULL
# consumers (everything Argus runs) this is close to unreachable, because a pull
# consumer only receives what it asked for. It bites push consumers, which is
# the correct place for it to bite.
max_pending: 8MB

# Argus has a handful of workers, the console, and the exporter.
max_connections: 256

# ─────────────────────────────────────────────────────────────────── logging
# `trace: true` logs EVERY PROTOCOL MESSAGE INCLUDING PAYLOADS. On this stack
# that means survey job descriptors and AI prompt metadata copied verbatim into
# the container log, where Alloy ships them to Loki -- the one place they were
# never meant to land. It is also how a debugging session fills the same VHDX
# these limits exist to protect. Both stay false; raise `debug` alone, briefly,
# if a connection is misbehaving.
debug: false
trace: false
logtime: true

# ───────────────────────────────────────────────────────── jetstream (server)
jetstream {
  # The named volume argus_nats_data is mounted here. NATS creates and owns a
  # `jetstream/` subdirectory beneath it, so the stream files land in
  # /data/jetstream/<account>/streams/<name> and nothing is written to the
  # mount root itself.
  store_dir: "/data"

  # SERVER-WIDE CEILINGS. These are the totals across every account, and they
  # exist so that adding a second account later cannot quietly double the
  # footprint. The per-account limits below are what actually bind today.
  #
  # 64 MB of memory store inside a 512 MB container: memory streams are stored
  # in the server's own heap, so this competes directly with connection buffers
  # and the file store's write cache. Argus declares no memory streams at all
  # (apply.sh creates every stream with file storage), so this is headroom for
  # an experiment, not a working budget.
  max_memory_store: 64MB

  # 2 GB on the shared VHDX. Sized as a budget, not as a measurement of need:
  # the six streams apply.sh creates total 960 MB of max_bytes, and the account
  # limit below holds 1.5 GB, which leaves room for JetStream's own per-stream
  # index and consumer state without letting the total run away.
  max_file_store: 2GB
}

# ──────────────────────────────────────────────────────────────── accounts
# ONE tenant account. An account in NATS is a hard subject-space boundary --
# separate accounts cannot see each other's subjects or streams at all, without
# any permission rules being written. That is the isolation that is real here.
accounts {
  ARGUS: {
    # PER-ACCOUNT JETSTREAM LIMITS.
    #
    # Without a `jetstream` block an account cannot use JetStream AT ALL, and
    # the failure reads "JetStream not enabled for account" while /healthz and
    # /jsz both report JetStream as perfectly enabled server-wide. So this block
    # is doing two jobs: turning the feature on for this account, and capping it.
    jetstream: {
      max_mem: 32MB
      max_file: 1536MB

      # HOW THIS LIMIT FAILS, because it is not the same as a stream limit.
      # A stream that reaches its own max_bytes applies its discard policy --
      # it drops old messages or refuses the publisher, and only that stream is
      # affected. An ACCOUNT that reaches max_file refuses publishes to EVERY
      # stream in the account with "insufficient storage resources", including
      # the dead-letter stream that would have recorded the failure. That is why
      # the streams' max_bytes are budgeted to total less than this: the
      # per-stream limit must always be the one that binds first.
      max_streams: 24
      max_consumers: 128

      # No single stream may exceed 512 MB, whoever creates it and whatever they
      # ask for. The largest stream apply.sh declares is 256 MB, so this is the
      # backstop for a stream created by hand at 3 a.m.
      disk_max_stream_bytes: 512MB
      memory_max_stream_bytes: 32MB

      # EVERY STREAM MUST DECLARE max_bytes. The server rejects a stream that
      # does not, rather than accepting one that is bounded only by max_age.
      # An age-only stream cannot be discarded against: `discard: old` has
      # nothing to discard until messages are old enough, so a producer looping
      # at speed fills the account limit above and takes every other stream down
      # with it. This turns that from a convention apply.sh follows into a rule
      # the server enforces -- including on `nats kv add`, which is a stream too
      # and therefore needs --max-bucket-size.
      max_bytes_required: true
    }

    # ── TWO USERS, ONE PRIVILEGE LEVEL. SAID PLAINLY. ─────────────────────
    #
    # `argus`  applications, and nats-init.
    # `agent`  the console: consumer lag, stream state, dead-letter listing.
    #
    # THERE ARE NO PER-SUBJECT PERMISSIONS ON EITHER USER, so inside this
    # account `agent` can do everything `argus` can: publish to any subject,
    # create and DELETE streams, purge them, and consume the jobs a worker was
    # about to take. The console's read-only behaviour comes from the console
    # process (ARGUS_ALLOW_WRITES=0 refuses every non-GET before route lookup),
    # not from this credential. Anyone reading this file must not conclude
    # otherwise, and the console must not claim a least-privilege queue identity
    # it does not have.
    #
    # What the split DOES buy, honestly: two credentials that rotate
    # independently, so a leaked console password does not require redeploying
    # every worker; distinguishable connections in /connz and the audit log; and
    # neither user is in the system account, so neither can issue server-level
    # commands over $SYS.
    #
    # What applying real permissions needs, so the next person does not start
    # from a blank page: `agent` requires publish on $JS.API.INFO,
    # $JS.API.STREAM.NAMES, $JS.API.STREAM.INFO.*, $JS.API.STREAM.MSG.GET.*,
    # $JS.API.CONSUMER.NAMES.*, $JS.API.CONSUMER.INFO.*.* and
    # $JS.API.DIRECT.GET.*, plus subscribe on _INBOX.> -- request/reply is how
    # the entire JetStream API works, so a permission set that forgets the inbox
    # produces "context deadline exceeded" on every call and reads as a network
    # fault. Denying $JS.API.STREAM.DELETE.* and $JS.API.STREAM.PURGE.* is the
    # part that actually matters.
    users: [
      { user: "argus", password: $NATS_ARGUS_PASSWORD }
      { user: "agent", password: $NATS_AGENT_PASSWORD }
    ]

    # EXPECT THIS LINE IN THE LOG, AND KNOW WHAT IT MEANS:
    #   [WRN] Plaintext passwords detected, use nkeys or bcrypt
    # It is about the value the server holds in memory, not about the wire and
    # not about this file -- there is no password in this file to protect.
    # `nats server passwd` produces a bcrypt hash that can go here instead, and
    # it is a genuine improvement, but not one this file can make alone: the
    # hash would have to become the value of NATS_ARGUS_PASSWORD while every
    # client still needs the plaintext, so .env and bootstrap.ps1 would carry
    # two values per user instead of one. Until that is done, the warning is
    # accurate and should not be filtered out of the logs to make them quiet.
  }
}

# ─────────────────────────────────────────────── deliberately absent, and why
#
# NO `no_auth_user`, AND NO DEFAULT ACCOUNT USER. With `accounts` defined, the
# built-in $G account still exists but has no users and no jetstream block, so
# an unauthenticated client cannot land anywhere. A single `no_auth_user` line
# would silently undo every credential above.
#
# NO SYSTEM ACCOUNT USER. $SYS exists internally; nobody can log into it,
# because doing so would need a third password and .env holds two. The cost is
# real and worth stating: `nats server report`, `nats server ls` and the $SYS
# event stream are unavailable, so server-level facts come from the HTTP
# monitoring endpoints on 8222 instead. Adding one later means a new variable in
# .env, bootstrap.ps1 and docker-compose.yml -- not a literal here.
#
# NO TLS. Every client is on the private `argus` bridge network and both ports
# are published to 127.0.0.1 only. At Site A this is wrong: ADR-0003 requires
# mTLS between nodes, and the cluster block below does not exist yet either.
#
# NO `cluster` BLOCK. One node, on purpose (see docker-compose.yml). The thing
# to remember when this becomes three: streams created here are R1, and an R1
# stream on a 3-node cluster looks entirely healthy in every UI right up to the
# moment its one node dies. apply.sh takes the replica count from
# ARGUS_NATS_REPLICAS so that Site A creates them R3 from the start; changing an
# existing stream's replica count afterwards is a separate, deliberate operation.
