{

  "Port": 6379,

  "Address": "0.0.0.0",

  "AuthenticationMode": "ACL",

  "AclFile": "/etc/garnet/secrets/users.acl",

  "AclStrictCustomCommands": true,

  "LogMemorySize": "192m",

  "PageSize": "16m",

  "IndexMemorySize": "32m",

  "BufferPoolMemoryBudget": "64m",

  "NetworkConnectionLimit": 256,

  "MaxDatabases": 1,

  "EnableStorageTier": true,

  "LogDir": "/data",
  "CheckpointDir": "/data",

  "SegmentSize": "128m",
  "ObjectLogSegmentSize": "128m",
  "CompactionType": "Shift",
  "CompactionFrequencySecs": 300,
  "CompactionMaxSegments": 8,
  "CompactionForceDelete": true,

  "Recover": false,

  "EnableAOF": false,

  "ExpiredKeyDeletionScanFrequencySecs": 3600,

  "LatencyMonitor": true,

  "CommandStatsMonitor": true,

  "SlowLogThreshold": 0,

  "MetricsSamplingFrequency": 5,

  "LogLevel": "Information",
  "DisableConsoleLogger": false,

  "EnableLua": false,
  "EnableDebugCommand": "No",
  "EnableModuleCommand": "No",

  "ProtectedMode": "False",

  "EnableCluster": false,

  "EnableTLS": false
}
