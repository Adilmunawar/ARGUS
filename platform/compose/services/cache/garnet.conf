/* ═══════════════════════════════════════════════════════════════════════════
 * Microsoft Garnet — the ElastiCache replacement for Argus.
 *
 * Loaded by the `garnet` service as --config-import-path=/etc/garnet/conf/garnet.conf.
 * The format is JSON with C-style comments and trailing commas allowed (Garnet
 * reads it with JsonCommentHandling.Skip). Keys are Options property names,
 * NOT the command-line flags: --memory is "LogMemorySize" here. Anything left
 * out keeps Garnet's own default, so this file holds only decisions.
 *
 * ── THE ONE THING TO UNDERSTAND BEFORE SIZING THIS ────────────────────────
 *
 * GARNET HAS NO maxmemory AND NO EVICTION. Redis intuition is wrong here and
 * wrong in the expensive direction. In Redis you set maxmemory, pick an
 * eviction policy, and the server throws keys away to stay inside it. Garnet
 * has neither setting. LogMemorySize below is NOT a memory ceiling: it is the
 * size of the in-memory region of the hybrid log. When the log outgrows it,
 * records BELOW the head address are written to disk (LogDir) and are still
 * live -- reading one is a disk read, not a miss.
 *
 * So the failure mode is not "keys disappear", it is "the container's working
 * set grows until Docker's mem_limit kills it, or /data fills the WSL2 VHDX".
 * mem_limit (GARNET_MEM_LIMIT, 768m by default) is the ONLY backstop, and the
 * numbers below exist to keep the process comfortably under it.
 *
 * The pressure signal is therefore SPILL, not memory percent. INFO STORE
 * reports Log.BeginAddress, Log.HeadAddress and Log.TailAddress: everything
 * between Begin and Head lives on disk, everything between Head and Tail is in
 * memory. A console that draws an "Evictions" tile is drawing a metric that
 * does not exist, and one that draws "memory used / maxmemory" has no
 * denominator to draw against: `CONFIG GET maxmemory` here returns an EMPTY
 * result, because the parameter is not merely unset, it does not exist. That
 * is also why the console is handed ARGUS_GARNET_MEM_LIMIT_BYTES from .env
 * rather than asking the server, and why the redis_exporter in the
 * observability profile will publish no maxmemory and no eviction series.
 *
 * Measured on this configuration: 400,000 x 1 KB values written into a 768 MB
 * container -- 419 MB of log. Container RSS settled at 310 MB, 218 MB of the
 * log was on disk in /data, DBSIZE stayed at 400000, and a GET of the very
 * first key still returned its value from disk. Nothing was evicted. A Redis
 * with maxmemory=768m would have thrown roughly half of it away instead.
 *
 * ── WHAT IS DELIBERATELY NOT HERE ─────────────────────────────────────────
 *
 * No password, no hash, no user. Garnet reads NO environment variables, so a
 * credential can only reach it on the command line (visible in `docker
 * inspect` and `ps`) or through the ACL file. The ACL file therefore holds the
 * only copy, it lives under ./secrets/garnet/ which is gitignored, and this
 * committed file only points at it. See the AclFile note below for the exact
 * contract that file has to satisfy.
 * ═══════════════════════════════════════════════════════════════════════════ */
{
  /* ────────────────────────────────────────────────────────────── listener ── */

  "Port": 6379,

  /* Bind every interface INSIDE the container. That is not an exposure
     decision: compose publishes this as 127.0.0.1:${GARNET_PORT}:6379, so the
     only things that can reach 6379 are containers on the `argus` network and
     the Windows host's loopback. Binding 127.0.0.1 here instead would leave
     the console -- a different container -- unable to connect at all, while
     the healthcheck (which runs inside this container) stayed green. */
  "Address": "0.0.0.0",

  /* ──────────────────────────────────────────────────────── authentication ── */

  /* ACL mode, not Password mode. Password mode is one shared secret with full
     rights, which cannot express "the console may look but not read". */
  "AuthenticationMode": "ACL",

  /* ── THE ACL FILE IS A CONTRACT, AND A MISSING RULE FAILS OPEN ───────────
   *
   * bootstrap.ps1 renders this file from GARNET_CONSOLE_PASSWORD. It is NOT in
   * git (platform/compose/secrets/ is ignored) and it must contain exactly:
   *
   *     user default off
   *     user console on >$GARNET_CONSOLE_PASSWORD ~* -@all +ping +select
   *       +info +dbsize +time +acl|whoami +config|get +client|info
   *       +client|list +command +command|count +command|docs +command|info
   *       +latency|histogram
   *
   * The console rule is WRAPPED ABOVE FOR READING ONLY: each `user` rule must
   * be a single line. (`#` starts a comment only at the start of a line, which
   * is why it can also be a password-hash operator inside a rule.)
   *
   * `user default off` IS LOAD-BEARING AND ITS ABSENCE IS SILENT. Garnet loads
   * this file by clearing all users, importing the rules, and then calling
   * CreateDefaultUserHandle -- which creates `default` with +@all and NOPASS
   * if, and only if, the file did not define it. Leave that line out and the
   * server accepts every anonymous connection with full rights: FLUSHALL from
   * anything that can open a socket. Nothing else in this stack can see that
   * state. The container healthcheck answers PING and goes GREEN either way,
   * which is exactly why garnet-init exists: it asserts that an
   * UNAUTHENTICATED PING is refused with NOAUTH.
   *
   * WHAT THE console USER MAY DO, AND WHY EACH ABSENCE IS DELIBERATE:
   *
   *   no +get / +mget / +keys / +scan / +hgetall — the console is a dashboard,
   *     not a client. It renders shape and health; it has no business reading
   *     survey data or a session token out of the cache, and a compromised
   *     console process should not be able to either.
   *   no +flushall / +flushdb / +del  — one mis-click must not empty the cache.
   *   no +config|set  — Garnet's CONFIG SET is not cosmetic: it resizes the
   *     main log and the hash index at runtime. One command from the console
   *     could push the store past the container limit and OOM the cache.
   *   no +acl|list / +acl|getuser  — ACL LIST prints each user's rules
   *     INCLUDING its `#<sha256>` password hashes. Granting it hands the
   *     console an offline-crackable copy of every credential on this server.
   *   no +slowlog|get  — slow-log entries carry the command's ARGUMENTS, so a
   *     logged SET is a logged value. That is the read privilege we just
   *     refused, arriving through a side door. (SlowLogThreshold is 0 below
   *     for the same reason.)
   *   no +debug / +module / +eval / +client|kill / +latency|reset / +acl|setuser.
   *     (Not +shutdown: Garnet has no SHUTDOWN command, and naming a command it
   *     does not have makes the SERVER REFUSE TO START. Every token in that rule
   *     has to be a real Garnet command, which is also why it is written out
   *     here rather than left to be guessed.)
   *
   *   +dbsize IS granted, with a warning attached: DBSIZE is NOT O(1) on
   *     Garnet. It scans the whole store (and, once the log has spilled, that
   *     scan reads from disk), as does INFO KEYSPACE -- which is why Garnet
   *     excludes KEYSPACE from plain INFO and from INFO ALL. It belongs behind
   *     a long cache TTL or a button a human pressed, never on the page-load
   *     path of a dashboard somebody leaves open.
   *   +command* IS granted because client libraries probe the command table
   *     when they connect. A NOPERM there fails the connection, and the
   *     console would report the whole cache as down.
   *   +time IS granted so the console can compare clocks. WSL2 drifts after
   *     the host sleeps, and skew is worth naming before it is diagnosed.
   *
   * KEY PATTERNS DO NOT WORK HERE, AND THE `~*` ABOVE IS NOT AN OVERSIGHT.
   * Garnet's ACL parser accepts `~*` and `allkeys` and treats both as no-ops;
   * ANY other pattern (`~cache:*`, `~session:*`) is an unknown operation and
   * the SERVER REFUSES TO START. There is no per-prefix key isolation on
   * Garnet -- only credential and command separation. A tenant boundary that
   * needs key isolation needs a second Garnet instance, not a second ACL rule.
   */
  "AclFile": "/etc/garnet/secrets/users.acl",

  /* Refuse to start if a rule names an extension command no module registered.
     Default, restated: the alternative is a typo'd `+gett` loading as an
     unresolved custom-command name and a user quietly holding a grant that
     matches nothing. */
  "AclStrictCustomCommands": true,

  /* ─────────────────────────────────────────────────────────────── memory ── */

  /* THE BUDGET, against mem_limit 768m (GARNET_MEM_LIMIT).
   *
   * Two ceilings sit below that 768 MB and BOTH bind before it does.
   *
   * The first is the .NET GC's. Garnet's index and log pages are pinned
   * allocations on the MANAGED heap, and .NET in a container sets its heap
   * hard limit to 75% of the cgroup limit -- 576 MB of the 768 MB, not 768 MB.
   * Sizing the store to the container limit is how a process OOMs at 70%.
   *
   * The second is that LOG MEMORY IS COUNTED TWICE. The log allocator caps
   * inline record bytes at LogMemorySize, and a separate size tracker caps the
   * .NET heap held by data-structure values (Hash/List/Set/SortedSet) at
   * LogMemorySize again. Garnet adds them itself: with the numbers below it
   * logs, at startup,
   *
   *     Total configured memory limit: 436207616        (= 416 MB)
   *          index 32 MB + log 192 MB + object heap 192 MB
   *
   * -- not the 224 MB that reading LogMemorySize as one budget suggests. That
   * line is the number to check after any change here; it is measured by the
   * server, and it must stay well under the 576 MB above once the ~64 MB
   * buffer pool, the network buffers and the runtime are added.
   *
   * Raising GARNET_MEM_LIMIT means raising these AND
   * ARGUS_GARNET_MEM_LIMIT_BYTES, which is the denominator the console draws
   * its gauge against. bootstrap generates that pair from one value; the split
   * below is hand-set, because only this file knows how it divides. */

  /* In-memory size of the hybrid log. NOT a maximum for the store: past it,
     records move to disk and stay live. Applied once to inline record bytes
     and once to the object heap, per the note above. */
  "LogMemorySize": "192m",

  /* The log is a circular buffer of pages, and a record must fit inside one,
     so this also caps the largest value that can be stored inline. 192m/16m
     gives 12 allocated pages; the startup log prints what it actually chose. */
  "PageSize": "16m",

  /* Hash index: fixed at startup, grown by IndexResizeFrequencySecs/Threshold
     (defaults, 60s/50%), never shrunk. Garnet's sizing rule is 16 bytes per
     expected key and it prints the result -- "optimized for up to ~2m distinct
     keys" for this value. Beyond that, keys still work; they chain into
     dynamically allocated overflow buckets that this number does not bound. */
  "IndexMemorySize": "32m",

  /* Bytes of sector-aligned I/O buffer Garnet keeps cached for reuse. The
     default is 1g -- larger than this whole container. Buffers above the
     budget are still served, just allocated and freed per use. */
  "BufferPoolMemoryBudget": "64m",

  /* Each connection costs network buffers. Unlimited (-1, the default) means
     one runaway client with a connection leak takes the cache down by OOM
     instead of being refused at connection 257. The estate needs a handful:
     the console, the exporter, and the applications. */
  "NetworkConnectionLimit": 256,

  /* One logical database. Garnet allows 16, and a key written to db 7 is
     invisible to every tile the console draws -- all of which read db 0 --
     while still occupying the same memory and the same disk. There is no
     ElastiCache-parity requirement that needs the other fifteen. */
  "MaxDatabases": 1,

  /* ────────────────────────────────────────────────────────── the disk tier ── */

  /* This is what makes "spills to disk" true rather than a phrase. With
     storage tiering OFF, Garnet cannot page the log out to disk at all, and
     the failure at the memory ceiling is much worse than a slow read. */
  "EnableStorageTier": true,

  /* /data is the argus_garnet_data NAMED VOLUME. Never a bind mount to C:\ --
     that path crosses 9p/virtiofs, where fsync is not honoured and record
     files are corrupted rather than merely slow. The whole compose file keeps
     this rule; the spill area is not an exception to it. */
  "LogDir": "/data",
  "CheckpointDir": "/data",

  /* ── THE SPILL AREA HAS A CEILING AND THESE FOUR SETTINGS ARE IT ─────────
   *
   * On Garnet's defaults (CompactionType None) the log spills to disk and NO
   * SEGMENT IS EVER DELETED. A cache under steady write load grows a directory
   * of 1 GB files until the WSL2 virtual disk -- shared with Postgres, the
   * object store and every image on this machine -- is full. That is not a
   * cache failure, it is an estate failure, and it arrives with no warning
   * from any metric in this stack.
   *
   * The ceiling here is SegmentSize x CompactionMaxSegments = 128m x 8 ≈ 1 GB,
   * checked every 5 minutes. Precisely: compaction runs when the ALREADY
   * FLUSHED part of the log (read-only address minus begin address) exceeds
   * that product, and it then trims back to one segment under it.
   *
   * "Shift" is Garnet's own name for "advance the begin address without
   * compacting", and Garnet's help text spells out the consequence: DATA LOSS.
   * The oldest segment is dropped whole -- not by LRU, not by TTL, not by any
   * property of the keys inside it. A key that had spilled into that segment
   * is simply gone, and the next read of it is a miss. Measured on this
   * configuration with the segment count lowered to force a run: 400,000 keys
   * in, one 128 MB hlog file deleted from /data, DBSIZE 400000 -> 175888, and
   * a GET of one of the lost keys returning nil. That is the intended
   * behaviour of this setting, and it is what "cache" has to mean here.
   *
   * That is the right trade for a CACHE and the wrong one for a database, and
   * it is chosen deliberately: the alternatives are Scan/Lookup, which copy
   * every live record back to the tail of the log -- i.e. back into the memory
   * we are trying to protect -- or None, which is the unbounded disk above.
   * Nothing in Argus may treat Garnet as a system of record. The durable
   * copies live in Postgres and in the object store.
   *
   * CompactionForceDelete is required, not optional, GIVEN the two settings
   * below it. Garnet normally defers the physical delete to the next
   * checkpoint so a crash cannot lose data that a recovery would need. This
   * instance never checkpoints and never recovers, so without force-delete the
   * segments are marked inactive and then kept forever, and the ceiling above
   * silently does not exist. */
  "SegmentSize": "128m",
  "ObjectLogSegmentSize": "128m",
  "CompactionType": "Shift",
  "CompactionFrequencySecs": 300,
  "CompactionMaxSegments": 8,
  "CompactionForceDelete": true,

  /* Start COLD, explicitly. A cache that recovers its previous checkpoint on
     boot resurrects the state the estate has already moved past -- stale
     sessions, stale rate-limit counters, stale query results -- and does it at
     the one moment (a restart) when an operator is least likely to suspect the
     cache. Cold means the first requests after a restart miss, which is
     correct and visible. */
  "Recover": false,

  /* No append-only file. Durability for a cache buys nothing here and costs a
     second write of every mutation into the same VHDX that the spill segments
     are already competing for. Its absence is why Recover above is honest:
     there is nothing to recover. */
  "EnableAOF": false,

  /* Garnet expires keys LAZILY by default (-1 = no background scan): a key
     whose TTL passed is removed when something next touches it, and a key
     nobody touches again holds its record indefinitely. In a cache, "nobody
     touches it again" is the normal end of a key's life, so the default means
     expired entries accumulate and push live data towards the disk.
     Hourly is deliberate rather than aggressive: this scan walks the store,
     which is the same cost as DBSIZE. It does not shrink the on-disk log --
     the log is append-only and only compaction reclaims segments. */
  "ExpiredKeyDeletionScanFrequencySecs": 3600,

  /* ─────────────────────────────────────────── what the console can observe ── */

  /* The console holds no read privilege, so INFO is its entire window. These
     two are what make that window worth having, and both are off by default. */

  /* Latency histograms, exposed through INFO and LATENCY HISTOGRAM. Without
     them the console can report that the cache is up and nothing about
     whether it is slow -- and "slow" is the failure people actually meet.

     THIS SETTING CANNOT STAND ALONE. Garnet refuses to start with
     "LatencyMonitor requires MetricsSamplingFrequency to be set" if the pair
     below is 0 (measured on 2.1.5, not inferred). The container then restarts
     forever with a message that names a setting nobody edited. */
  "LatencyMonitor": true,

  /* Per-command calls, failures and rejections, through INFO COMMANDSTATS.
     This is the only way to see WHAT the cache is doing without reading keys,
     and it is also where a misconfigured client shows up as a wall of
     rejections rather than as a silence. */
  "CommandStatsMonitor": true,

  /* Slow log DISABLED, and not for cost. Its entries retain the command's
     arguments, so the moment it is on, anything that can run SLOWLOG GET can
     read keys and values -- including the console user, whose whole point is
     that it cannot. Turning this on is a decision about who may read the
     cache, not a decision about diagnostics. */
  "SlowLogThreshold": 0,

  /* The sampling period, in seconds, for the monitor task -- required by
     LatencyMonitor above, and separately the ONLY source of the per-second
     rate figures (instantaneous_ops_per_sec, network throughput) that any
     cache dashboard leads with. Garnet's default of 0 turns the task off, so
     those fields would be permanently zero: a measured-looking number that
     means "nobody is sampling", which is exactly the kind of zero this estate
     refuses to display. The task accumulates counters and logs nothing, so
     five seconds costs almost nothing and bounds how stale a rate can be. */
  "MetricsSamplingFrequency": 5,

  /* Information, not the default Warning. On a laptop estate the startup lines
     -- which config file was imported, that the ACL file loaded, which
     endpoints were bound -- are the difference between diagnosing "my config
     change did nothing" in one `docker logs` and in an afternoon. Logging is
     capped by compose at 10 MB x 3 files. */
  "LogLevel": "Information",
  "DisableConsoleLogger": false,

  /* ─────────────────────────────────────────────────────── attack surface ── */

  /* Each of these is already the default. They are restated because a default
     is a thing that changes between versions, and because "we chose this" and
     "we never looked" are indistinguishable in a file that omits them.

     EVAL executes attacker-supplied code in the server process. DEBUG can
     crash the server and read its memory. MODULE loads a .NET assembly into
     it. Argus has no requirement for any of the three, and the ACL denies them
     to the only user that exists -- but an ACL is one mistake away and these
     are the same denial made a second time, at the server. */
  "EnableLua": false,
  "EnableDebugCommand": "No",
  "EnableModuleCommand": "No",

  /* NOT Redis's protected mode, and this line exists so nobody assumes it is.
     In Garnet, ProtectedMode changes ONE thing: the default bind address when
     Address is empty (loopback instead of any). Because Address is set above,
     this setting has no effect at all. It is not a fallback for
     authentication and it will not save an instance whose ACL file failed to
     load -- garnet-init is what catches that. */
  "ProtectedMode": "False",

  /* Single node. Cluster mode changes the ACL surface (gossip needs its own
     credential), the failure modes and the console's whole cache screen; Site
     A gets it, a laptop does not benefit from it. */
  "EnableCluster": false,

  /* HONEST LIMITATION: traffic on the `argus` bridge is PLAINTEXT, and so is
     everything Garnet writes to /data -- Garnet does not encrypt spilled data
     or checkpoints. On one machine, behind a loopback-only publish, that is
     an accepted risk. At Site A it is not: that deployment needs --tls with a
     real certificate, and the cache volume needs disk encryption underneath
     it. Neither is simulated here, because a sandbox that pretends to have
     TLS teaches the wrong lesson about what still has to be built. */
  "EnableTLS": false
}
