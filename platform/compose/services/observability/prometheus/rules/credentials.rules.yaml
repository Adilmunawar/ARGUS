groups:
  - name: argus.alerts.credential_rejection
    rules:
      - alert: ArgusSeaweedS3CredentialRejected
        expr: sum by (instance, bucket) (increase(SeaweedFS_s3_request_total{code=~"401|403"}[15m])) > 10
        for: 10m
        labels:
          severity: page
        annotations:
          summary: 'SeaweedFS S3 rejected {{ $value }} requests on bucket {{ $labels.bucket }} as unauthorised in 15m'
          description: 'A rotated or expired access key that was not propagated. The identities in s3.json are written once by seaweed-config from the ARGUS_S3_*_SECRET variables; changing one in .env without re-running that init container leaves the client and the gateway disagreeing. Reads and writes fail while every healthcheck stays green.'
          runbook: 'docker compose run --rm seaweed-config; docker compose restart seaweed-s3'

      - alert: ArgusGarnetAuthFailing
        expr: |
          redis_up == 0
            and on (job, instance)
          argus_target:seen_alive:24h == 1
        for: 5m
        labels:
          severity: page
        annotations:
          summary: 'garnet-exporter cannot authenticate to Garnet'
          description: 'The exporter keeps serving /metrics when its credential is refused, so up==1 proves nothing here. GARNET_CONSOLE_PASSWORD in .env and the console user in secrets/garnet/users.acl have diverged, which means the console has almost certainly lost the cache too.'

  - name: argus.alerts.expiry
    rules:
      - alert: ArgusCertificateExpiringSoon
        expr: (argus_certificate_expiry_timestamp_seconds - time()) < 21 * 86400
        for: 1h
        labels:
          severity: ticket
        annotations:
          summary: 'Certificate {{ $labels.subject }} expires in {{ $value | humanizeDuration }}'
          description: 'Three weeks is enough lead time to renew inside a maintenance window. Emitted on the argus_ namespace by the app that owns the certificate, the same convention the gitops app rules use for backup and function timestamps.'

      - alert: ArgusCertificateExpiringCritical
        expr: (argus_certificate_expiry_timestamp_seconds - time()) < 5 * 86400
        for: 30m
        labels:
          severity: page
        annotations:
          summary: 'Certificate {{ $labels.subject }} expires in {{ $value | humanizeDuration }}'
          description: 'Past this point renewal is an incident rather than a change. Every client that pins or validates this certificate fails at once and at the same moment.'

      - alert: ArgusCertificateExpired
        expr: (argus_certificate_expiry_timestamp_seconds - time()) <= 0
        for: 5m
        labels:
          severity: page
        annotations:
          summary: 'Certificate {{ $labels.subject }} has expired'
          description: 'Connections are being refused now. This fires separately from the countdown alerts so it survives an inhibition on the warning tiers.'

      - alert: ArgusTokenExpiringSoon
        expr: (argus_token_expiry_timestamp_seconds - time()) < 7 * 86400
        for: 1h
        labels:
          severity: ticket
        annotations:
          summary: 'Token {{ $labels.token }} expires in {{ $value | humanizeDuration }}'
          description: 'Covers the OpenBao-issued and bootstrap-written credentials whose holder publishes an expiry timestamp. An expired token fails closed, and the first symptom is usually an unrelated service reporting an auth error.'

      - alert: ArgusTokenExpired
        expr: (argus_token_expiry_timestamp_seconds - time()) <= 0
        for: 5m
        labels:
          severity: page
        annotations:
          summary: 'Token {{ $labels.token }} has expired'
          description: 'Renewal did not happen. Anything holding this token is now unauthenticated against whatever issued it.'
