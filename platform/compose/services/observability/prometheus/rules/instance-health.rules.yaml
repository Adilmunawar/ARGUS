groups:
  - name: argus.alerts.availability
    rules:
      - alert: ArgusTargetDown
        expr: |
          up == 0
            and on (job, instance)
          argus_target:seen_alive:24h == 1
        for: 10m
        keep_firing_for: 5m
        labels:
          severity: page
        annotations:
          summary: '{{ $labels.job }} target {{ $labels.instance }} has been unreachable for 10m'
          description: 'Scrape of {{ $labels.instance }} (job {{ $labels.job }}, tier {{ $labels.tier }}) has failed continuously. The container is stopped, unhealthy, or off the argus network. This only fires for targets seen alive in the last 24h, so a profile that was never started stays quiet.'
          runbook: 'docker compose ps; docker compose logs --tail=200 {{ $labels.job }}'

      - alert: ArgusTargetFlapping
        expr: |
          argus_target:up:ratio_5m > 0
            and
          argus_target:up:ratio_5m < 0.9
        for: 15m
        labels:
          severity: ticket
        annotations:
          summary: '{{ $labels.instance }} is scraping intermittently ({{ $value | humanizePercentage }} success over 5m)'
          description: 'A target that answers some scrapes and not others is usually memory pressure, a scrape_timeout that is too tight for the exporter, or a container being restarted by its own healthcheck.'

      - alert: ArgusPrometheusConfigReloadFailed
        expr: prometheus_config_last_reload_successful == 0
        for: 5m
        labels:
          severity: page
        annotations:
          summary: 'Prometheus rejected its last configuration reload'
          description: 'A malformed rule file is tolerated on reload but FATAL at startup. Fix it before any restart or Prometheus will not come back and the whole alerting path goes dark silently.'
          runbook: 'docker compose exec prometheus promtool check config /etc/prometheus/prometheus.yml'

      - alert: ArgusPrometheusRuleEvaluationFailing
        expr: increase(prometheus_rule_evaluation_failures_total[10m]) > 0
        for: 10m
        labels:
          severity: ticket
        annotations:
          summary: 'Prometheus rule group {{ $labels.rule_group }} is failing to evaluate'
          description: 'Every alert in this group is now blind. The usual cause is a recording rule referencing a metric whose label set changed after an exporter upgrade.'

      - alert: ArgusPrometheusScrapeSampleLimit
        expr: increase(prometheus_target_scrapes_exceeded_sample_limit_total[30m]) > 0
        for: 10m
        labels:
          severity: ticket
        annotations:
          summary: 'Prometheus is discarding scrapes that exceed the sample limit'
          description: 'The whole scrape is dropped, not the excess. Metrics from that target disappear entirely rather than degrading.'

      - alert: ArgusAlertmanagerNotificationsFailing
        expr: increase(alertmanager_notifications_failed_total[15m]) > 0
        for: 5m
        labels:
          severity: page
        annotations:
          summary: 'Alertmanager cannot deliver to integration {{ $labels.integration }}'
          description: 'Alerts are firing but not reaching anyone. Check SMTP reachability from the container and the console webhook. Alertmanager never retries a 4xx, so a 405 from the read-only console looks like silence.'

      - alert: ArgusAlloyStoppedShippingLogs
        expr: |
          sum(rate(loki_write_sent_entries_total[15m])) == 0
            and on ()
          up{job="alloy"} == 1
        for: 15m
        labels:
          severity: ticket
        annotations:
          summary: 'Alloy is running but has sent zero log entries to Loki for 15m'
          description: 'Alloy is healthy, so this is discovery or the docker socket proxy, not the process. Check that the proxy still answers /containers/json.'

      - alert: ArgusAlloyDroppingLogs
        expr: increase(loki_write_dropped_entries_total[15m]) > 0
        for: 5m
        labels:
          severity: ticket
        annotations:
          summary: 'Alloy dropped {{ $value | humanize }} log entries after exhausting retries'
          description: 'Entries are gone, not delayed. Loki is refusing the push: usually a per-stream rate limit or a 429 from max_global_streams_per_user.'

      - alert: ArgusLokiIngestionRejected
        expr: sum by (reason) (increase(loki_discarded_samples_total[15m])) > 0
        for: 10m
        labels:
          severity: ticket
        annotations:
          summary: 'Loki discarded log lines with reason {{ $labels.reason }}'
          description: 'rate_limited means per_stream_rate_limit is too low for a chatty service; greater_than_max_sample_age means a container replayed old logs; max_line_size_truncate handles long lines without discarding.'
