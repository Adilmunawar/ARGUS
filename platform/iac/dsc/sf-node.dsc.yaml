# DSC v3 configuration — Service Fabric node (Server Core, Shielded VM)
$schema: https://aka.ms/dsc/schemas/v3/bundled/config/document.json
resources:
  - name: features
    type: Microsoft.Windows/WindowsFeature
    properties: { names: [NET-Framework-45-Core], ensure: present }
  - name: wdac
    type: Argus/WdacPolicy
    properties: { policyId: argus-base, mode: audit }            # → enforced in Phase 6
  - name: gpo-membership
    type: Argus/OuPlacement
    properties: { ou: "OU=SF,OU=Tier1,OU=Servers,DC=argus,DC=local" }
  - name: sysmon
    type: Argus/WinSwService
    properties: { name: Sysmon64, source: "argus-artifacts/tools/sysmon/15.15/Sysmon64.exe", sha256: "<pinned>", args: "-i C:\\Argus\\policies\\sysmon.xml" }
  - name: windows-exporter
    type: Argus/WinSwService
    properties: { name: windows_exporter, source: "argus-artifacts/tools/windows_exporter/0.30.0/windows_exporter.exe", sha256: "<pinned>", args: "--collectors.enabled=cpu,memory,logical_disk,net,service,process,tcp" }
  - name: wazuh-agent
    type: Argus/MsiPackage
    properties: { source: "argus-artifacts/tools/wazuh/4.13/wazuh-agent.msi", sha256: "<pinned>", args: "WAZUH_MANAGER=siem-01.argus.local" }
  - name: alloy
    type: Argus/WinSwService
    properties: { name: alloy, source: "argus-artifacts/tools/alloy/1.9.0/alloy.exe", sha256: "<pinned>", args: "run C:\\Argus\\alloy\\config.alloy" }
  - name: servicefabric
    type: Argus/ServiceFabricNode
    properties: { cluster: argus-sf-a, nodeType: primary, certThumbprintFrom: "Argus-Issuing-CA:sf-node" }
