<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Overview - Argus Console</title>
<!--
  The console runs inside an egress-restricted network and must never fetch
  anything (ADR-0027). No fonts, no CDN, no analytics, no telemetry.

  frame-ancestors cannot be set from a meta tag; a real deployment sends it as a
  header from Caddy. Everything else that can be enforced statically is.
-->
<meta http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; form-action 'none'; base-uri 'none'; object-src 'none'">
<meta name="referrer" content="no-referrer">
<meta name="color-scheme" content="light dark">
<link rel="stylesheet" href="assets/app.css">
<link rel="stylesheet" href="assets/components.css">
</head>
<body>

<a class="skip" href="#main">Skip to main content</a>

<!-- One live region for the whole console, announced deliberately. -->
<div id="live" class="sr" role="status" aria-live="polite" aria-atomic="true"></div>

<div class="shell">

  <nav class="side" aria-label="Sections">
    <div class="mark">
      <span class="leafmark" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="#c8e36f" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="3.2"/>
          <path d="M12 3.4v2.2M12 18.4v2.2M3.4 12h2.2M18.4 12h2.2M6 6l1.6 1.6M16.4 16.4L18 18M18 6l-1.6 1.6M7.6 16.4L6 18"/>
        </svg>
      </span>
      <span class="txt"><b>Argus</b><span>Zaraat Dost</span></span>
    </div>

    <button class="railbtn" id="railbtn" type="button" aria-label="Collapse navigation">
      <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M15 6l-6 6 6 6"/></svg>
      <span class="lbl">Collapse</span>
    </button>

    <div class="navgroup" id="ng-run">Run</div>
    <button class="nav" data-go="overview" type="button" aria-describedby="ng-run">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12l9-8 9 8"/><path d="M5 10v10h14V10"/></svg>
      <span class="lbl">Overview</span>
    </button>
    <button class="nav" data-go="apps" type="button">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>
      <span class="lbl">Applications</span>
    </button>
    <button class="nav" data-go="deploys" type="button">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v12"/><path d="M8 11l4 4 4-4"/><path d="M4 19h16"/></svg>
      <span class="lbl">Deployments</span>
      <span class="badge" id="nav-deploy-badge">1</span>
    </button>

    <div class="navgroup" id="ng-infra">Infrastructure</div>
    <button class="nav" data-go="compute" type="button">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="7" rx="1.6"/><rect x="3" y="13" width="18" height="7" rx="1.6"/><path d="M7 7.5h.01M7 16.5h.01"/></svg>
      <span class="lbl">Compute</span>
    </button>
    <button class="nav" data-go="data" type="button">
      <svg viewBox="0 0 24 24" aria-hidden="true"><ellipse cx="12" cy="6" rx="8" ry="3"/><path d="M4 6v12c0 1.7 3.6 3 8 3s8-1.3 8-3V6"/><path d="M4 12c0 1.7 3.6 3 8 3s8-1.3 8-3"/></svg>
      <span class="lbl">Data</span>
    </button>
    <button class="nav" data-go="ml" type="button">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="6" cy="6" r="2.4"/><circle cx="18" cy="6" r="2.4"/><circle cx="12" cy="18" r="2.4"/><path d="M7.7 7.7l3 8M16.3 7.7l-3 8M8.4 6h7.2"/></svg>
      <span class="lbl">ML &amp; geospatial</span>
    </button>

    <div class="navgroup" id="ng-govern">Govern</div>
    <button class="nav" data-go="identity" type="button">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="3.6"/><path d="M4.5 20c1.2-4 4-6 7.5-6s6.3 2 7.5 6"/></svg>
      <span class="lbl">Identity &amp; secrets</span>
    </button>
    <button class="nav" data-go="security" type="button">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l7 3v6c0 4.4-3 8-7 9-4-1-7-4.6-7-9V6z"/><path d="M9.5 12l1.8 1.8 3.4-3.6"/></svg>
      <span class="lbl">Security</span>
      <span class="badge" id="nav-alert-badge">4</span>
    </button>
    <button class="nav" data-go="ops" type="button">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3.2"/><path d="M12 2.8v2.6M12 18.6v2.6M2.8 12h2.6M18.6 12h2.6M5.5 5.5l1.9 1.9M16.6 16.6l1.9 1.9M18.5 5.5l-1.9 1.9M7.4 16.6l-1.9 1.9"/></svg>
      <span class="lbl">Operations</span>
    </button>
    <button class="nav" data-go="system" type="button">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="12" rx="1.6"/><path d="M8 20h8M12 16v4"/></svg>
      <span class="lbl">System</span>
    </button>
    <button class="nav" data-go="audit" type="button">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3h9l4 4v14H6z"/><path d="M15 3v4h4"/><path d="M9 12h6M9 16h6"/></svg>
      <span class="lbl">Audit</span>
    </button>
  </nav>

  <div class="shellcol">

    <header class="top">
      <button class="burger" id="burger" type="button" aria-label="Open navigation" aria-expanded="false">
        <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
      </button>

      <nav class="crumbs" aria-label="Breadcrumb"><span id="crumb"></span></nav>

      <button class="kbar" id="kbar" type="button">
        <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="11" cy="11" r="6.4"/><path d="M16 16l4 4"/></svg>
        <span>Search or jump to...</span>
        <kbd>Ctrl K</kbd>
      </button>

      <button class="envpill" id="envbtn" type="button"></button>

      <button class="iconbtn" id="helpbtn" type="button" aria-label="Keyboard shortcuts" title="Keyboard shortcuts">
        <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M9.6 9.4a2.5 2.5 0 113.4 2.3c-.7.3-1 .9-1 1.6v.3"/><path d="M12 17h.01"/></svg>
      </button>

      <button class="iconbtn" id="prefsbtn" type="button" aria-label="Console preferences" title="Console preferences">
        <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3.1"/><path d="M19.4 15a1.7 1.7 0 00.34 1.87l.06.06a2 2 0 11-2.83 2.83l-.06-.06a1.7 1.7 0 00-1.87-.34 1.7 1.7 0 00-1 1.56V21a2 2 0 11-4 0v-.09A1.7 1.7 0 008.9 19.3a1.7 1.7 0 00-1.87.34l-.06.06a2 2 0 11-2.83-2.83l.06-.06a1.7 1.7 0 00.34-1.87 1.7 1.7 0 00-1.56-1H3a2 2 0 110-4h.09A1.7 1.7 0 004.7 8.9a1.7 1.7 0 00-.34-1.87l-.06-.06a2 2 0 112.83-2.83l.06.06a1.7 1.7 0 001.87.34H9a1.7 1.7 0 001-1.56V3a2 2 0 114 0v.09a1.7 1.7 0 001 1.56 1.7 1.7 0 001.87-.34l.06-.06a2 2 0 112.83 2.83l-.06.06a1.7 1.7 0 00-.34 1.87V9a1.7 1.7 0 001.56 1H21a2 2 0 110 4h-.09a1.7 1.7 0 00-1.56 1z"/></svg>
      </button>

      <button class="iconbtn" id="bell" type="button" aria-label="4 open alerts" title="Open alerts">
        <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M6 9a6 6 0 1112 0c0 4 1.4 5.6 2 6.3H4c.6-.7 2-2.3 2-6.3z"/><path d="M10 19a2 2 0 004 0"/></svg>
        <span class="dot" aria-hidden="true"></span>
      </button>

      <button class="whopill" id="whobtn" type="button">
        <span class="avatar" aria-hidden="true">AM</span>
        <span class="who-text"><b>Adil Munawar</b><span>Operator · Tier 1</span></span>
      </button>
    </header>

    <div class="elevation" id="elevation" role="status" hidden></div>
    <div class="flashes" id="flashes"></div>

    <main class="main" id="main" tabindex="-1"></main>

  </div>
</div>

<div class="scrim" id="scrim" hidden></div>

<!--
  The session drawer is mounted once and never removed on navigation, so a
  terminal survives moving between screens. GCP's Cloud Shell drawer, scoped by
  role rather than a free root shell.
-->
<aside class="drawer" id="drawer" hidden aria-label="Active session">
  <div class="drawer-head">
    <strong>Session</strong>
    <button class="x" id="drawer-close" type="button" aria-label="Close the session drawer">×</button>
  </div>
  <div class="drawer-body" id="drawer-body"></div>
</aside>

<script src="js/data.js"></script>
<!-- The data layer sits between the screens and whatever is behind them: the
     console API when one is running, the bundled fixtures when it is not. -->
<script src="js/store.js"></script>
<script src="js/ui.js"></script>
<script src="js/app.js"></script>
<script src="js/screens/overview.js"></script>
<script src="js/screens/apps.js"></script>
<script src="js/screens/deploys.js"></script>
<script src="js/screens/compute.js"></script>
<script src="js/screens/data.js"></script>
<script src="js/screens/identity.js"></script>
<script src="js/screens/security.js"></script>
<script src="js/screens/ml.js"></script>
<script src="js/screens/ops.js"></script>
<script src="js/screens/system.js"></script>
<script src="js/screens/audit.js"></script>
</body>
</html>
